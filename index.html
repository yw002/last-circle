<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Web PUBG - Erangel 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(0, 255, 0, 0.8); transform: translate(-50%, -50%); box-shadow: 0 0 4px black; border-radius: 50%; }
        #info { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 2px 2px 4px black; font-size: 22px; font-weight: bold; line-height: 1.5; }
        #health-bar-bg { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 400px; height: 24px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.8); border-radius: 4px; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: #4caf50; transition: width 0.2s, background-color 0.2s; }
        #weapon-info { position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%); color: white; text-shadow: 2px 2px 4px black; font-size: 28px; font-weight: bold; text-align: center; font-style: italic; }
        #equip-info { position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); color: white; text-shadow: 1px 1px 3px black; font-size: 20px; font-weight: bold; text-align: center; background: rgba(0,0,0,0.4); padding: 4px 15px; border-radius: 8px; }
        #kill-feed { position: absolute; top: 20px; right: 20px; color: white; text-shadow: 1px 1px 3px black; font-size: 16px; text-align: right; line-height: 1.6; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #2a0000 0%, #030000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; }
        @keyframes bloodGlitch {
            0% { transform: translate(0, 0) skew(0deg); text-shadow: 3px 3px 0 #aa0000, -3px -3px 0 #330000; }
            12% { transform: translate(-2px, 1px) skew(-2deg); text-shadow: 4px -2px 0 #dd0000, -4px 1px 0 #550000; }
            24% { transform: translate(1px, -2px) skew(1deg); text-shadow: -2px 4px 0 #880000, 3px -2px 0 #220000; }
            36% { transform: translate(0, 0) skew(0deg); text-shadow: 3px 3px 0 #aa0000, -3px -3px 0 #330000; }
            100% { transform: translate(0, 0) skew(0deg); text-shadow: 3px 3px 0 #aa0000, -3px -3px 0 #330000; }
        }
        #title { color: #8b0000; font-size: 76px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 5px; text-align: center; font-family: "Impact", "Georgia", serif; animation: bloodGlitch 1.6s infinite linear; }
        #subtitle { color: #f39c12; font-size: 25px; margin-bottom: 40px; text-shadow: 2px 2px 4px black; font-weight: bold; font-family: "Trebuchet MS", sans-serif; letter-spacing: 1px; }
        #start-btn { padding: 18px 55px; font-size: 28px; cursor: pointer; background: linear-gradient(180deg, #900, #400); border: 2px solid #b00; color: #fff; font-weight: bold; border-radius: 8px; transition: 0.2s; box-shadow: 0 0 15px #900; text-transform: uppercase; font-family: "Impact", sans-serif; letter-spacing: 1px; }
        #start-btn:hover { background: linear-gradient(180deg, #c00, #600); transform: scale(1.05); box-shadow: 0 0 25px #f00, inset 0 0 10px rgba(0,0,0,0.5); }
        .instructions { color: #ddd; margin-top: 40px; text-align: center; line-height: 1.8; font-size: 17px; text-shadow: 1px 1px 2px black; background: rgba(0,0,0,0.7); border: 1px solid #4a0000; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .key { display: inline-block; background: #222; color: #ff3333; padding: 2px 8px; border-radius: 4px; border: 1px solid #4a0000; font-family: monospace; font-weight: bold; }
        #hit-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.4) 100%); opacity: 0; transition: opacity 0.15s; pointer-events: none; z-index: 5; }
        #zone-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,255,0.2); opacity: 0; transition: opacity 0.5s; pointer-events: none; z-index: 4; }
        #interact-prompt { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: white; text-shadow: 2px 2px 4px black; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 4px; display: none; }
        #scope-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 3; }
        #scope-overlay .scope-vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.8) 65%); transition: background 0.3s; }
        #scope-overlay .scope-cross-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,0,0,0.7); transform: translateY(-50%); }
        #scope-overlay .scope-cross-v { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: rgba(0,0,0,0.7); transform: translateX(-50%); }
        #scope-overlay .scope-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }
        #reload-bar-bg { position: absolute; bottom: 95px; left: 50%; transform: translateX(-50%); width: 200px; height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; display: none; }
        #reload-bar { width: 0%; height: 100%; background: #3498db; border-radius: 3px; transition: width 0.05s linear; }
        #inventory { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .inv-slot { width: 100px; height: 30px; background: rgba(0,0,0,0.4); border: 2px solid #555; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 4px; }
        .inv-slot.active { border-color: #f1c40f; background: rgba(241,196,15,0.3); }
    </style>
</head>
<body>
    <div id="ui">
        <div id="crosshair"></div>
        <div id="info"></div>
        <div id="interact-prompt">按 F 拾取物资</div>
        <div id="scope-overlay">
            <div class="scope-vignette"></div>
            <div class="scope-cross-h"></div>
            <div class="scope-cross-v"></div>
            <div class="scope-dot"></div>
        </div>
        <div id="reload-bar-bg"><div id="reload-bar"></div></div>
        <div id="kill-feed"></div>
        <div id="inventory">
            <div id="slot-1" class="inv-slot active">M1911</div>
            <div id="slot-2" class="inv-slot">空槽位 (2)</div>
        </div>
        <div id="equip-info">
            <span id="ui-helmet">无头盔</span> &nbsp;|&nbsp; <span id="ui-armor">无防弹衣</span> &nbsp;|&nbsp; <span id="ui-scope">机瞄</span>
        </div>
        <div id="weapon-info"></div>
        <div id="health-bar-bg"><div id="health-bar"></div></div>
    </div>
    <div id="hit-overlay"></div>
    <div id="zone-overlay"></div>
    <div id="overlay">
        <div id="title">WEB PUBG</div>
        <div id="subtitle">末日求生：丧尸感染爆发 (WASTELAND SURVIVAL: ZOMBIE OUTBREAK)</div>
        <button id="start-btn">跳伞开始 (Deploy)</button>
        <div class="instructions">
            <b>操作说明 (Controls)</b><br>
            <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> 移动/跳伞控制 &nbsp;|&nbsp; 鼠标移动 视角<br>
            <span class="key">左键</span> 射击 &nbsp;|&nbsp; <span class="key">右键</span> 瞄准开镜 &nbsp;|&nbsp; <span class="key">Space</span> 跳跃 &nbsp;|&nbsp; <span class="key">Shift</span> 奔跑/加速降落<br>
            <span class="key">R</span> 换弹 &nbsp;|&nbsp; <span class="key">1</span> <span class="key">2</span> 切换武器 &nbsp;|&nbsp; <span class="key">F</span> 拾取物资<br>
            收集地上的物资以提高生存率：医疗包、护甲、头盔、武器、子弹、倍镜。<br>
            拾取的武器弹匣为空，记得按 R 换弹！现在 AI 敌人也会与你一起跳伞。
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- 禁用右键菜单 (用于开镜) ---
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- 游戏全局变量 ---
        let camera, scene, renderer, controls;
        let objects = [];
        let raycaster;
        let ambLight, dirLight;
        let lightningFlashTime = 0;
        let lightningBoltLine = null;
        let isLightningFlashing = false;
        const mapSize = 5000; // 地图增大2倍
        const botCount = 149;
        let bots = [];
        let aliveCount = botCount + 1;
        let killFeed = [];
        let lootItems = [];
        let birds = [];
        let deers = [];
        let zombies = [];
        let boars = [];
        let ghosts = [];
        let housePositions = [];
        let doors = [];
        let rockPositions = [];
        let gameStarted = false; // 极其关键：游戏是否已正式初始化启动状态锁，彻底解决切回窗口时触发重复生成的卡死Bug
        let parachuteGroup;
        let viewWeaponMesh; // 第一人称武器模型
        let muzzleFlash, muzzleLight; // 枪口火花与光源

        // --- 天气系统 ---
        let clouds = [];
        let rainParticles = [];
        let isRaining = false;
        let rainStartTime = 0;
        const RAIN_START_ENEMIES_MIN = 40; // 至少40个敌人时开始下雨
        const RAIN_START_ENEMIES_MAX = 30; // 最多30个敌人时开始下雨

        // --- 统一平衡难度系统 (全面削弱敌人的射击精准度、伤害和开火速度，解决瞬间暴毙、体验太难的痛点)
        const difficulties = {
            easy: {
                name: "末日生存",
                botDamageMultiplier: 0.6, // 基础伤害系数从1.0降至0.6
                botHealth: 130, // 机器人血量从180降至130，更容易击杀
                botAccuracy: 0.28, // 命中率从0.6大幅降低至0.28，子弹会大量打偏描边，给玩家充足的射击反击和战术躲避空间
                botTargetRange: 350, // 侦测距离从450调小到350
                botToPlayerDamageFactor: 0.35, // 撞击对玩家伤害降至0.35 (单发AKM仅造成8-12伤害)，再也不会瞬间暴毙！
                botSpeed: 18, // 速度降低到18
                botFireRateMultiplier: 3.5 // 射击间隔提升到3.5倍，开火更慢更笨拙
            }
        };
        let currentDifficulty = 'easy';

        // --- 粒子系统 (血液/特效) ---
        let bloodParticles = [];
        const bloodMat = new THREE.MeshBasicMaterial({color: 0x8a0303});
        const bloodGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);

        function spawnBlood(point, normal) {
            for(let i=0; i<12; i++) {
                const mesh = new THREE.Mesh(bloodGeo, bloodMat);
                mesh.position.copy(point);
                scene.add(mesh);
                const vx = normal.x * 5 + (Math.random()-0.5)*15;
                const vy = normal.y * 5 + Math.random()*15 + 5;
                const vz = normal.z * 5 + (Math.random()-0.5)*15;
                bloodParticles.push({mesh, vx, vy, vz, age: 0});
            }
        }

        function spawnMuzzleFlash() {
            if(!muzzleFlash) {
                muzzleFlash = new THREE.Group();

                // 1. 中心高亮亮白核心
                const coreMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 1});
                const core = new THREE.Mesh(new THREE.SphereGeometry(0.24, 6, 6), coreMat);
                muzzleFlash.add(core);

                // 2. 5个散射的高反差橙黄色尖锐小锥体，组成十字星芒特效
                const spikeMat = new THREE.MeshBasicMaterial({color: 0xff8800, transparent: true, opacity: 0.95});
                const spikeGeo = new THREE.ConeGeometry(0.12, 1.2, 5);
                spikeGeo.translate(0, 0.6, 0); // 将原点平移到锥体底部，方便缩放

                // 向上散射
                const spikeU = new THREE.Mesh(spikeGeo, spikeMat);
                muzzleFlash.add(spikeU);

                // 向下散射
                const spikeD = new THREE.Mesh(spikeGeo, spikeMat);
                spikeD.rotation.z = Math.PI;
                muzzleFlash.add(spikeD);

                // 向左散射
                const spikeL = new THREE.Mesh(spikeGeo, spikeMat);
                spikeL.rotation.z = Math.PI / 2;
                muzzleFlash.add(spikeL);

                // 向右散射
                const spikeR = new THREE.Mesh(spikeGeo, spikeMat);
                spikeR.rotation.z = -Math.PI / 2;
                muzzleFlash.add(spikeR);

                // 向前喷射 (枪管前方)
                const spikeF = new THREE.Mesh(spikeGeo, spikeMat);
                spikeF.rotation.x = Math.PI / 2;
                muzzleFlash.add(spikeF);

                muzzleFlash.visible = false;
                viewWeaponMesh.add(muzzleFlash); // 挂载到第一人称枪械网格上，绑定物理后坐力抖动

                // 3. 在枪口核心加入动态 PointLight 点光源，瞬间点亮枪体、双手和四周地表
                muzzleLight = new THREE.PointLight(0xffaa00, 5.0, 45);
                muzzleLight.visible = false;
                viewWeaponMesh.add(muzzleLight);
            }

            // 依据不同武器设置精确的局部坐标系枪口偏移
            let offsetZ = -0.8;
            let offsetY = 0.15;
            if (player.weapon.name === 'M1911') {
                offsetZ = -0.45;
                offsetY = 0.1;
            } else if (player.weapon.name === 'S686') {
                offsetZ = -1.0;
                offsetY = 0.1;
            } else if (player.weapon.name === 'Kar98k') {
                offsetZ = -1.25;
                offsetY = 0.1;
            }

            // 定位在武器枪口尖端 (局部坐标 x=0 是枪管中轴线)
            muzzleFlash.position.set(0, offsetY, offsetZ);
            muzzleLight.position.set(0, offsetY, offsetZ);

            // 随机旋转星芒 Z 轴，让每次开枪的火光星芒都不一样 (极具细节)
            muzzleFlash.rotation.z = Math.random() * Math.PI;

            // 随机整体大小
            let scaleVal = 0.8 + Math.random() * 0.6;
            muzzleFlash.scale.set(scaleVal, scaleVal, scaleVal * 1.3);

            // 瞬间开启火光与局部点光源
            muzzleFlash.visible = true;
            muzzleLight.visible = true;

            // 60毫秒后自动关闭，形成瞬态火花
            setTimeout(() => {
                if(muzzleFlash) muzzleFlash.visible = false;
                if(muzzleLight) muzzleLight.visible = false;
            }, 60);

            // 抛壳效果
            spawnBulletCasing();
        }

        let shellCasings = [];
        const shellMat = new THREE.MeshBasicMaterial({color: 0xd4af37}); // 金色弹壳
        const shellGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.2, 6);

        function spawnBulletCasing() {
            if(shellCasings.length > 20) {
                scene.remove(shellCasings[0].mesh);
                shellCasings.shift();
            }
            const shell = new THREE.Mesh(shellGeo, shellMat);
            // 从枪身右侧弹出
            const pos = camera.position.clone();
            const dir = new THREE.Vector3(0.4, -0.4, -1.0).applyQuaternion(camera.quaternion);
            shell.position.copy(pos).add(dir);
            shell.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            scene.add(shell);

            // 弹壳抛出速度和方向（向右弹出）
            let vx = 2 + Math.random() * 2; // 向右
            let vy = Math.random() * 1.5 + 0.5;
            let vz = -Math.random() * 1.5 - 0.5;

            shellCasings.push({mesh: shell, vx, vy, vz, rotSpeed: (Math.random() - 0.5) * 20, age: 0});
        }

        // --- 装备系统 ---
        const equipments = [
            { type: "helmet", level: 1, reduction: 0.3, name: "一级头 (Lv.1)", color: 0x27ae60 },
            { type: "helmet", level: 2, reduction: 0.4, name: "二级头 (Lv.2)", color: 0x2980b9 },
            { type: "helmet", level: 3, reduction: 0.55, name: "三级头 (Lv.3)", color: 0x8e44ad },
            { type: "armor", level: 1, reduction: 0.3, name: "一级甲 (Lv.1)", color: 0x27ae60 },
            { type: "armor", level: 2, reduction: 0.4, name: "二级甲 (Lv.2)", color: 0x2980b9 },
            { type: "armor", level: 3, reduction: 0.55, name: "三级甲 (Lv.3)", color: 0x8e44ad }
        ];

        const scopes = [
            { type: "scope", level: 1, name: "红点", fov: 65, color: 0xe74c3c },
            { type: "scope", level: 2, name: "2倍", fov: 55, color: 0x3498db },
            { type: "scope", level: 3, name: "4倍", fov: 40, color: 0x9b59b6 },
            { type: "scope", level: 4, name: "8倍", fov: 25, color: 0x34495e }
        ];

        const weapons = [
            { name: "AKM", ammo: 30, maxAmmo: 30, damage: 42, fireRate: 100, range: 800, color: 0x333333, sound: 'ar', scope: null },
            { name: "M416", ammo: 30, maxAmmo: 30, damage: 38, fireRate: 80, range: 800, color: 0x222222, sound: 'ar_fast', scope: null },
            { name: "S686", ammo: 2, maxAmmo: 2, damage: 85, fireRate: 800, range: 50, color: 0x555555, sound: 'shotgun', scope: null },
            { name: "Kar98k", ammo: 5, maxAmmo: 5, damage: 95, fireRate: 1500, range: 1500, color: 0x8b4513, sound: 'sniper', scope: null }
        ];

        // --- 玩家状态 ---
        let player = {
            health: 500, maxHealth: 500, alive: true,
            helmet: null, armor: null,
            sharedAmmo: 0, isReloading: false, isADS: false,
            weapon: { name: "M1911", ammo: 15, maxAmmo: 15, damage: 20, fireRate: 400, range: 300, color: 0xaaaaaa, sound: 'pistol', scope: null },
            inventory: [ { name: "M1911", ammo: 15, maxAmmo: 15, damage: 20, fireRate: 400, range: 300, color: 0xaaaaaa, sound: 'pistol', scope: null }, null ],
            currentWeaponIndex: 0,
            lastFire: 0, isParachuting: true, kills: 0, recoilY: 0, cameraRecoil: 0
        };

        // --- 掩体碰撞检测盒 ---
        let colliders = [];

        // --- 毒圈 (Blue Zone) ---
        let zone = {
            x: 0, z: 0, radius: 1500, targetX: 0, targetZ: 0, targetRadius: 1500, phase: 0, nextShrinkTime: 45, lastTick: 0
        };
        let zoneMesh;

        // --- 音效系统 (支持 3D 空间音效) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, sourcePos = null) {
            if(!audioCtx || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);

            // 如果提供了声音来源位置，则使用 PannerNode 来产生真实的3D距离和方向感
            if (sourcePos) {
                const panner = audioCtx.createPanner();
                panner.panningModel = 'HRTF';
                panner.distanceModel = 'exponential';
                panner.refDistance = 10;
                panner.maxDistance = 2000;
                panner.rolloffFactor = 1.2;

                panner.positionX.value = sourcePos.x;
                panner.positionY.value = sourcePos.y;
                panner.positionZ.value = sourcePos.z;

                gain.connect(panner);
                panner.connect(audioCtx.destination);
            } else {
                gain.connect(audioCtx.destination); // 玩家自己的声音没有方向
            }

            const now = audioCtx.currentTime;
            // 如果是环境音效，基础音量大一点以便衰减，玩家自己的音量低一点
            let vol = sourcePos ? 2.5 : 0.4;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(vol * 0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else {
                // Shoot sounds based on weapon type
                if(type === 'shotgun') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.2);
                    gain.gain.setValueAtTime(vol * 1.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if(type === 'sniper') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(vol * 2.5, now); // Kar98k 声音传播最远最响
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if(type === 'ar_fast') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
                    gain.gain.setValueAtTime(vol * 0.8, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if(type === 'ar') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    gain.gain.setValueAtTime(vol * 1.0, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(vol * 0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                }
            }
        }

        // --- Web Audio 丧尸惊悚声效动态合成器 ---
        function playZombieSound(type, sourcePos = null) {
            if(!audioCtx || audioCtx.state === 'suspended') return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            // 极低频喉音基准 (咆哮 65Hz，撕咬 120Hz)
            osc.frequency.setValueAtTime(type === 'growl' ? 65 : 120, now);
            if (type === 'growl') {
                osc.frequency.linearRampToValueAtTime(45, now + 1.2); // 音调下坠
            } else {
                osc.frequency.linearRampToValueAtTime(80, now + 0.4);
            }

            // LFO 低频调制器：产生喉咙颤动、咯咯作响的惊悚效果
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(type === 'growl' ? 12 : 25, now); // 12Hz 或 25Hz 调幅
            lfoGain.gain.setValueAtTime(type === 'growl' ? 25 : 45, now);

            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency); // 频率调频调制

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(220, now); // 闷重闷重的声音效果

            osc.connect(filter);
            filter.connect(gain);

            if (sourcePos) {
                const panner = audioCtx.createPanner();
                panner.panningModel = 'HRTF';
                panner.distanceModel = 'exponential';
                panner.refDistance = 15;
                panner.maxDistance = 1000;
                panner.rolloffFactor = 1.5;

                panner.positionX.value = sourcePos.x;
                panner.positionY.value = sourcePos.y;
                panner.positionZ.value = sourcePos.z;

                gain.connect(panner);
                panner.connect(audioCtx.destination);
            } else {
                gain.connect(audioCtx.destination);
            }

            let vol = sourcePos ? 3.0 : 0.6;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(vol, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, now + (type === 'growl' ? 1.4 : 0.5));

            lfo.start(now);
            osc.start(now);
            lfo.stop(now + 1.5);
            osc.stop(now + 1.5);
        }

        function getHouseObjectIsInside(position) {
            if (!position) return null;
            for(let i=0; i<doors.length; i++) {
                let d = doors[i];
                let hPos = d.housePos;
                let dx = Math.abs(position.x - hPos.x);
                let dz = Math.abs(position.z - hPos.z);
                let dy = position.y - hPos.y;
                // 洋房高度加深至 24，检查任意坐标水平与高度范围，判定其是否处于中空大厅内部
                if (dx < 14.5 && dz < 14.5 && dy > 0 && dy < 24) {
                    return d; // 返回所处洋房大厅的门引用，唯一指代洋房实体
                }
            }
            return null;
        }

        function getHousePlayerIsInside() {
            return getHouseObjectIsInside(controls.getObject().position);
        }

        // --- 地形生成算法 ---
        function getBaseTerrainHeight(x, z) {
            let dist = Math.sqrt(x*x + z*z);
            let height = 80 - (dist / (mapSize/2)) * 80;
            height += Math.sin(x/150)*30 + Math.cos(z/150)*30;
            height += Math.sin(x/30)*8 + Math.cos(z/30)*8;
            return Math.max(-10, height);
        }

        function getTerrainHeight(x, z) {
            // 平铺地基平整算法：如果坐标靠近任何一栋房屋，将其平整至该房地基高度，防止穿模悬空
            for (let i = 0; i < housePositions.length; i++) {
                let h = housePositions[i];
                let dx = x - h.x;
                let dz = z - h.z;
                let distSq = dx*dx + dz*dz;

                // 24x24以内的正方形地基地表平滑/强制铺平
                if (distSq < 26 * 26) {
                    let baseH = h.baseHeight;
                    if (distSq < 18 * 18) {
                        return baseH; // 核心区域100%水平平整
                    }
                    // 18到26之间做平滑线性过渡，避免出现陡峭断崖
                    let dist = Math.sqrt(distSq);
                    let t = (dist - 18) / 8;
                    return THREE.MathUtils.lerp(baseH, getBaseTerrainHeight(x, z), t);
                }
            }
            return getBaseTerrainHeight(x, z);
        }

        function initClouds() {
            const cloudGeo = new THREE.SphereGeometry(1, 8, 8);
            const cloudMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,

            });

                    part.position.set(
                        (Math.random() - 0.5) * 80,
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 40
                    );

                }

                // 随机位置和高度
                cloudGroup.position.set(
                    (Math.random() - 0.5) * mapSize * 1.5,

                );

        function playThunderSound() {
            if(!audioCtx || audioCtx.state === 'suspended') return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const oscLow = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(15, now + 1.8);

            oscLow.type = 'square';
            oscLow.frequency.setValueAtTime(45, now);
            oscLow.frequency.exponentialRampToValueAtTime(10, now + 1.5);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(120, now);
            filter.frequency.exponentialRampToValueAtTime(25, now + 1.8);

            osc.connect(filter);
            oscLow.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            // 雷鸣声的动态音量包络 (有来回滚荡的效果)
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(2.2, now + 0.15); // 快速上升
            gain.gain.setValueAtTime(2.2, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 2.0); // 指数衰减

            osc.start(now);
            oscLow.start(now);
            osc.start(now + 2.0);
            oscLow.stop(now + 2.0);
        }

        function createLightningBolt() {
            if (lightningBoltLine) {
                scene.remove(lightningBoltLine);
            }

            let playerPos = controls.getObject().position;
            // 随机在玩家前方 150 - 300 距离内生成
            let angle = Math.random() * Math.PI * 2;
            let dist = 150 + Math.random() * 150;
            let startX = playerPos.x + Math.cos(angle) * dist;
            let startZ = playerPos.z + Math.sin(angle) * dist;
            let startY = 300; // 天空高度

            let endX = startX + (Math.random() - 0.5) * 50;
            let endZ = startZ + (Math.random() - 0.5) * 50;
            let endY = getTerrainHeight(endX, endZ);

            // 建立12段劈向地面的折线节点
            const points = [];
            let segments = 12;
            let currentX = startX;
            let currentY = startY;
            let currentZ = startZ;
            points.push(new THREE.Vector3(currentX, currentY, currentZ));

            for(let i = 1; i <= segments; i++) {
                let t = i / segments;
                let targetX = THREE.MathUtils.lerp(startX, endX, t);
                let targetY = THREE.MathUtils.lerp(startY, endY, t);
                let targetZ = THREE.MathUtils.lerp(startZ, endZ, t);

                if (i < segments) {
                    currentX = targetX + (Math.random() - 0.5) * 22;
                    currentY = targetY;
                    currentZ = targetZ + (Math.random() - 0.5) * 22;
                } else {
                    currentX = endX;
                    currentY = endY;
                    currentZ = endZ;
                }
                points.push(new THREE.Vector3(currentX, currentY, currentZ));
            }

            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color: 0xffffff,
                linewidth: 4 // 虽然大部分WebGL实现不支持加粗，但依然安全
            });

            lightningBoltLine = new THREE.Line(geo, mat);
            scene.add(lightningBoltLine);
        }

        function updateWeather(delta) {
            let playerPos = controls.getObject().position;

            // 1. 更新白云位置
            clouds.forEach(cloud => {
                // 狂风暴雨下云彩飞移速度提升 4 倍
                let cloudSpeedMultiplier = isRaining ? 4.0 : 1.0;
                cloud.position.x += cloud.userData.speed * delta * 10 * cloudSpeedMultiplier;
                if (cloud.position.x > mapSize) {
                    cloud.position.x = -mapSize;
                }
            });

            // 2. 暴风雨天空颜色、浓雾平滑过渡
            if (isRaining && !isLightningFlashing) {
                scene.background.lerp(new THREE.Color(0x1a212a), 0.05); // 暗灰蓝色暴风雨天空
                scene.fog.color.lerp(new THREE.Color(0x1a212a), 0.05);
                scene.fog.density = THREE.MathUtils.lerp(scene.fog.density, 0.0016, 0.05); // 更浓稠的暴雨雾气
            }

            // 3. 检查是否开始下雨
            if (!isRaining && player.alive && aliveCount <= RAIN_START_ENEMIES_MIN) {
                if (aliveCount <= RAIN_START_ENEMIES_MAX || Math.random() < 0.02) {
                    isRaining = true;
                    addKillFeed("<span style='color:#e74c3c; font-weight: bold;'>⚠️ 警告：雷暴天气即将来临，狂风大作！</span>");

                    // 创建更密集的雨滴粒子系统 (3块交错高度的雨云，确保降雨连贯无脉冲空洞)
                    const rainMat = new THREE.PointsMaterial({
                        color: 0x90a9e1, // 偏蓝冷的雨水颜色
                        size: 0.9, // 雨滴细化至 0.9，消除方块颗粒感，呈现真实斜落雨丝效果
                        transparent: true,
                        opacity: 0.7,
                        depthWrite: false // 极其关键：防止半透明雨滴写入深度缓存，一举根治背景丧尸、敌人被裁剪穿透变透明的经典 3D Bug！
                    });

                    for (let c = 0; c < 3; c++) {
                        const rainGeo = new THREE.BufferGeometry();
                        const rainCount = 3000; // 每层 3000 粒子，总计 9000 粒子，细密紧实
                        const positions = new Float32Array(rainCount * 3);
                        for (let i = 0; i < rainCount; i++) {
                            positions[i * 3] = (Math.random() - 0.5) * 500;
                            positions[i * 3 + 1] = Math.random() * 300; // 单层雨柱高度覆盖
                            positions[i * 3 + 2] = (Math.random() - 0.5) * 500;
                        }
                        rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                        const rain = new THREE.Points(rainGeo, rainMat);
                        // 交错初始高度：100, 200, 300
                        rain.position.y = 100 + c * 100;
                        rainParticles.push(rain);
                        scene.add(rain);
                    }
                }
            }

            // 4. 更新雨滴位置 (狂风卷着暴雨斜飘下落，交错层层下落重置，形成无断断续续感的完美暴雨)
            rainParticles.forEach((rain, idx) => {
                // 雨滴始终笼罩和跟随着玩家移动 (修复原先玩家走出雨区的Bug)
                rain.position.x = playerPos.x;
                rain.position.z = playerPos.z;

                rain.position.y -= 380 * delta; // 下落速度大幅提升 (200 -> 380)

                // 粒子整体因风力沿X和Z轴横移，产生倾斜落雨效果
                // 各自下落到不同阈值时，独立回到高空重置，消除整块重置的脉冲虚假感
                if (rain.position.y < -150) {
                    rain.position.y = 180;
                }
            });

            // 5. 闪电电闪雷鸣逻辑
            if (isRaining) {
                // 每帧有 0.04% 的极微小概率触发闪电，降低频率至 35-45 秒一次，体验极其自然舒服
                if (!isLightningFlashing && Math.random() < 0.0004) {
                    isLightningFlashing = true;
                    lightningFlashTime = Date.now();

                    // 释放撕碎天空的炸雷声
                    playThunderSound();

                    // procedural 生成劈向近处地面的3D折线闪电
                    createLightningBolt();
                }

                if (isLightningFlashing) {
                    let elapsed = Date.now() - lightningFlashTime;
                    if (elapsed < 120) {
                        // 阶段1：闪电强光，天空和浓雾变成刺眼的亮白蓝色，亮度大增
                        scene.background.setHex(0xd0ebff);
                        scene.fog.color.setHex(0xd0ebff);
                        if (ambLight) ambLight.intensity = 3.0;
                        if (dirLight) dirLight.intensity = 3.0;
                    } else if (elapsed < 220) {
                        // 阶段2：瞬间变暗 (电弧间歇)
                        scene.background.setHex(0x1a212a);
                        scene.fog.color.setHex(0x1a212a);
                        if (ambLight) ambLight.intensity = 0.4;
                        if (dirLight) dirLight.intensity = 0.3;
                    } else if (elapsed < 300) {
                        // 阶段3：二次闪烁 (余闪/复电)
                        scene.background.setHex(0xb5e0ff);
                        scene.fog.color.setHex(0xb5e0ff);
                        if (ambLight) ambLight.intensity = 2.4;
                        if (dirLight) dirLight.intensity = 2.4;
                    } else {
                        // 阶段4：闪电结束，移除闪电线，渐进恢复暴雨阴暗亮度
                        isLightningFlashing = false;
                        if (lightningBoltLine) {
                            scene.remove(lightningBoltLine);
                            lightningBoltLine = null;
                        }
                        if (ambLight) ambLight.intensity = 0.7;
                        if (dirLight) dirLight.intensity = 0.6;
                    }
                }
            }
        }

        function initTerrain() {
            const geometry = new THREE.PlaneGeometry(mapSize, mapSize, 200, 200);
            geometry.rotateX(-Math.PI / 2);
            const vertices = geometry.attributes.position.array;
            const colors = [];

            for(let i=0; i<vertices.length; i+=3) {
                let x = vertices[i];
                let z = vertices[i+2];
                let height = getTerrainHeight(x, z);
                vertices[i+1] = height;

                // 根据地形高度和位置决定颜色
                let color = new THREE.Color();
                if(height < 2) {
                    color.setHex(0x2980b9); // 水边深色
                } else if(height < 5) {
                    color.setHex(0x3d8c40); // 低地草地
                } else if(height < 15) {
                    color.setHex(0x4a7c2e); // 普通草地
                } else if(height < 30) {
                    color.setHex(0x556b2f); // 高地草地
                } else {
                    color.setHex(0x6b8e23); // 山地
                }

                // 添加道路系统（更宽更明显的道路）
                let roadFactor = 0;
                // 横向主要道路
                for(let rx = -mapSize/2; rx < mapSize/2; rx += 500) {
                    if(Math.abs(x - rx) < 20) roadFactor = 0.5;
                }
                // 纵向主要道路
                for(let rz = -mapSize/2; rz < mapSize/2; rz += 500) {
                    if(Math.abs(z - rz) < 20) roadFactor = 0.5;
                }
                // 交叉路口（更宽）
                for(let rx = -mapSize/2; rx < mapSize/2; rx += 500) {
                    for(let rz = -mapSize/2; rz < mapSize/2; rz += 500) {
                        if(Math.abs(x - rx) < 25 && Math.abs(z - rz) < 25) {
                            roadFactor = 0.7;
                        }
                    }
                }

                if(roadFactor > 0) {
                    color.lerp(new THREE.Color(0x555555), roadFactor); // 灰色道路
                }

                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
            geometry.computeVertexNormals();

            const material = new THREE.MeshLambertMaterial({vertexColors: true});
            const terrain = new THREE.Mesh(geometry, material);
            scene.add(terrain);
            objects.push(terrain);

            const waterGeo = new THREE.PlaneGeometry(mapSize, mapSize);
            waterGeo.rotateX(-Math.PI / 2);
            const waterMat = new THREE.MeshBasicMaterial({color: 0x2980b9, transparent: true, opacity: 0.8});
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.position.y = 0;
            scene.add(water);
        }

        function createTextSprite(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            // 绘制圆角半透明黑底
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(4, 4, 248, 56, 12);
            } else {
                ctx.rect(4, 4, 248, 56);
            }
            ctx.fill();

            // 绘制白边
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 绘制文字
            ctx.font = 'bold 24px "Segoe UI", sans-serif';
            ctx.fillStyle = color || '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.fillText(text, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(7, 1.75, 1);
            return sprite;
        }

        function spawnLoot(bx, by, bz) {
            // 物资生成在建筑物旁边，而不是在建筑物内部
            for(let i=0; i<4; i++) {
                let lx = bx + (Math.random() - 0.5) * 50;
                let lz = bz + (Math.random() - 0.5) * 50;
                let ly = getTerrainHeight(lx, lz) + 1.5;

                // 检查是否在水中
                if(ly < 1) continue;

                let r = Math.random();
                let type, itemData;
                let color = 0xffffff;
                let geo = new THREE.BoxGeometry(2, 2, 2);

                if(r < 0.3) {
                    type = "weapon";
                    itemData = weapons[Math.floor(Math.random() * weapons.length)];
                    color = itemData.color;
                    geo = new THREE.BoxGeometry(4, 0.5, 1); // 枪长条形
                } else if(r < 0.6) {
                    type = "ammo";
                    color = 0x27ae60;
                    geo = new THREE.BoxGeometry(1.5, 1, 1); // 弹药盒
                    itemData = { name: "弹药箱 (60发)", amount: 60 };
                } else if(r < 0.7) {
                    type = "health";
                    color = 0xe74c3c;
                } else if(r < 0.75) {
                    type = "scope";
                    itemData = scopes[Math.floor(Math.random() * scopes.length)];
                    color = itemData.color;
                    geo = new THREE.CylinderGeometry(0.5, 0.5, 2, 8); // 瞄准镜圆柱体
                } else if(r < 0.85) {
                    type = "helmet";
                    let lvls = [0, 0, 1, 1, 2]; // 偏向低级
                    itemData = equipments.filter(e => e.type === "helmet")[lvls[Math.floor(Math.random()*lvls.length)]];
                    color = itemData.color;
                    geo = new THREE.SphereGeometry(1.5, 8, 8); // 头盔球形
                } else {
                    type = "armor";
                    let lvls = [0, 0, 1, 1, 2];
                    itemData = equipments.filter(e => e.type === "armor")[lvls[Math.floor(Math.random()*lvls.length)]];
                    color = itemData.color;
                    geo = new THREE.BoxGeometry(3, 3, 0.5); // 防弹衣扁平
                }

                const mat = new THREE.MeshLambertMaterial({color: color, emissive: color, emissiveIntensity: 0.4});
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(lx, ly, lz);

                // 添加 3D 浮动文字标签
                let labelName = itemData ? itemData.name : (type === "health" ? "急救包" : "物资");
                let labelColor = "#ffffff";
                if (type === "weapon") labelColor = "#f1c40f";
                else if (type === "ammo") labelColor = "#2ecc71";
                else if (type === "health") labelColor = "#e74c3c";
                else if (type === "scope") labelColor = "#9b59b6";
                else if (type === "helmet" || type === "armor") labelColor = "#3498db";

                const labelSprite = createTextSprite(labelName, labelColor);
                labelSprite.position.set(0, 1.8, 0);
                mesh.add(labelSprite);

                // 移除 PointLight，避免光源数量超出 WebGL 极限导致所有模型不可见（玩空气bug）
                scene.add(mesh);

                lootItems.push({ mesh: mesh, type: type, data: itemData });
            }
        }

        function initEnvironment() {
            // 巨大树木 - 像真实森林 (预先创建材质和几何体以提升性能)
            const trunkMatPine = new THREE.MeshLambertMaterial({color: 0x5c4033});
            const leavesMatPine = new THREE.MeshLambertMaterial({color: 0x274e13});
            const trunkGeoPine = new THREE.CylinderGeometry(5, 8, 60, 8);
            const cone1Geo = new THREE.ConeGeometry(35, 70, 8);
            const cone2Geo = new THREE.ConeGeometry(28, 60, 8);
            const cone3Geo = new THREE.ConeGeometry(20, 50, 8);

            // 阔叶橡树
            const trunkMatOak = new THREE.MeshLambertMaterial({color: 0x4d2f1d});
            const leavesMatOak = new THREE.MeshLambertMaterial({color: 0x194d19});
            const trunkGeoOak = new THREE.CylinderGeometry(6, 10, 45, 8);
            const sphere1Geo = new THREE.SphereGeometry(22, 8, 8);
            const sphere2Geo = new THREE.SphereGeometry(18, 8, 8);
            const sphere3Geo = new THREE.SphereGeometry(14, 8, 8);

            // 秋叶白桦树
            const trunkMatBirch = new THREE.MeshLambertMaterial({color: 0xdddddd}); // 白灰色树干
            const leavesMatBirch = new THREE.MeshLambertMaterial({color: 0xd4ac0d}); // 金黄色秋叶
            const trunkGeoBirch = new THREE.CylinderGeometry(3.5, 5.5, 60, 8);
            const birch1Geo = new THREE.ConeGeometry(28, 54, 8);
            const birch2Geo = new THREE.ConeGeometry(22, 46, 8);
            const birch3Geo = new THREE.ConeGeometry(16, 38, 8);

            // 抖动网格森林生成算法：大地图划分为 45x45 个单元格，每个网格内只随机抖动偏移产生一棵大树
            // 这样既能实现2000棵树的饱满森林，又100%绝无大树重合交叉，且避开洋房
            const cells = 45;
            const cellSize = 4500 / cells; // 地图核心游玩范围 4500

            for(let col = 0; col < cells; col++) {
                for(let row = 0; row < cells; row++) {
                    let cellMinX = -2250 + col * cellSize;
                    let cellMinZ = -2250 + row * cellSize;

                    // 局部微调偏移
                    let x = cellMinX + 10 + Math.random() * (cellSize - 20);
                    let z = cellMinZ + 10 + Math.random() * (cellSize - 20);
                    let y = getTerrainHeight(x, z);

                    if(y < 2) continue; // 避免在深水区生成大树

                    // 距离检测：确保大树绝不生成在任何一栋洋房内部或紧贴大门 (35米避让)
                    let tooCloseToHouse = false;
                    for (let h of housePositions) {
                        let dx = x - h.x;
                        let dz = z - h.z;
                        if (dx*dx + dz*dz < 35 * 35) {
                            tooCloseToHouse = true;
                            break;
                        }
                    }
                    if(tooCloseToHouse) continue;

                    // 互斥避让检测：防止大树与刚才生成的天然岩石发生重叠堆叠 (保持至少 20 米间距)
                    let tooCloseToRock = false;
                    for (let j = 0; j < rockPositions.length; j++) {
                        let r = rockPositions[j];
                        let dx = x - r.x;
                        let dz = z - r.z;
                        if (dx*dx + dz*dz < 20 * 20) {
                            tooCloseToRock = true;
                            break;
                        }
                    }
                    if(tooCloseToRock) continue;

                    const tree = new THREE.Group();
                    let treeType = Math.floor(Math.random() * 3);
                    let trunk;

                    if (treeType === 0) { // 松树
                        trunk = new THREE.Mesh(trunkGeoPine, trunkMatPine); trunk.position.y = 30;
                        const l1 = new THREE.Mesh(cone1Geo, leavesMatPine); l1.position.y = 65;
                        const l2 = new THREE.Mesh(cone2Geo, leavesMatPine); l2.position.y = 95;
                        const l3 = new THREE.Mesh(cone3Geo, leavesMatPine); l3.position.y = 120;
                        tree.add(trunk, l1, l2, l3);
                        objects.push(trunk, l1, l2, l3);
                    } else if (treeType === 1) { // 阔叶橡树
                        trunk = new THREE.Mesh(trunkGeoOak, trunkMatOak); trunk.position.y = 22.5;
                        const l1 = new THREE.Mesh(sphere1Geo, leavesMatOak); l1.position.y = 48;
                        const l2 = new THREE.Mesh(sphere2Geo, leavesMatOak); l2.position.y = 64;
                        const l3 = new THREE.Mesh(sphere3Geo, leavesMatOak); l3.position.y = 78;
                        tree.add(trunk, l1, l2, l3);
                        objects.push(trunk, l1, l2, l3);
                    } else { // 白桦树
                        trunk = new THREE.Mesh(trunkGeoBirch, trunkMatBirch); trunk.position.y = 30;
                        const l1 = new THREE.Mesh(birch1Geo, leavesMatBirch); l1.position.y = 62;
                        const l2 = new THREE.Mesh(birch2Geo, leavesMatBirch); l2.position.y = 84;
                        const l3 = new THREE.Mesh(birch3Geo, leavesMatBirch); l3.position.y = 104;
                        tree.add(trunk, l1, l2, l3);
                        objects.push(trunk, l1, l2, l3);
                    }

                    tree.position.set(x, y - 6, z); // 整体下凹 6 坐标，让树根深埋入地，防止在陡峭山坡上悬浮穿模
                    scene.add(tree);

                    // 强行触发世界变换矩阵更新，解决 setFromObject(trunk) 碰撞盒堆叠在 (0,30,0) 的百年 Bug！
                    tree.updateMatrixWorld(true);

                    // 添加树干碰撞盒，并将其加入 objects 以便子弹检测
                    const colliderBox = new THREE.Box3().setFromObject(trunk);
                    colliders.push(colliderBox);
                }
            }

            // 石头 (新增掩体) - 放到地面上
            const rockGeo = new THREE.DodecahedronGeometry(8, 1);
            const rockMat = new THREE.MeshLambertMaterial({color: 0x7f8c8d});
            rockPositions = []; // 清空重置

            for(let i=0; i<600; i++) {
                let x = (Math.random() - 0.5) * mapSize * 0.9;
                let z = (Math.random() - 0.5) * mapSize * 0.9;
                let y = getTerrainHeight(x, z);
                if(y < 0) continue;

                // 避让检测：防止石头穿插到洋房的地基或内部 (保持至少 30 米间距)
                let tooCloseToHouse = false;
                for (let j = 0; j < housePositions.length; j++) {
                    let h = housePositions[j];
                    let dx = x - h.x;
                    let dz = z - h.z;
                    if (dx*dx + dz*dz < 30 * 30) {
                        tooCloseToHouse = true;
                        break;
                    }
                }
                if (tooCloseToHouse) {
                    continue;
                }

                const rock = new THREE.Mesh(rockGeo, rockMat);
                rock.scale.set(1 + Math.random()*2, 0.5 + Math.random()*0.5, 1 + Math.random()*2);
                rock.position.set(x, y + rock.geometry.parameters.radius * 0.5, z);
                rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                scene.add(rock);
                objects.push(rock); // 石头可以挡子弹

                // 保存石头位置用于树木互斥生成
                rockPositions.push({ x, z });

                // 强制要求更新石头世界位置矩阵，解决 setFromObject(rock) 碰撞盒扎堆在原点的 Bug！
                rock.updateMatrixWorld(true);

                const colliderBox = new THREE.Box3().setFromObject(rock);
                // 缩小石头的碰撞盒 (水平缩小 30%)，使其与模型更贴合，允许玩家更靠近石头
                let dx = (colliderBox.max.x - colliderBox.min.x) * 0.15;
                let dz = (colliderBox.max.z - colliderBox.min.z) * 0.15;
                colliderBox.min.x += dx;
                colliderBox.max.x -= dx;
                colliderBox.min.z += dz;
                colliderBox.max.z -= dz;
                colliders.push(colliderBox);
            }

            // 普通房屋 (升级为中空房屋架构，利用 10 块薄壁板拼装中空大门道与开阔窗洞；升级窗体为半透明亮蓝玻璃，铺设高质感实木地板，杜绝杂草与白墙外皮)
            const bldgBaseMat = new THREE.MeshLambertMaterial({color: 0xf5f5dc, side: THREE.DoubleSide}); // 米黄色墙面双面渲染
            const roofMat = new THREE.MeshLambertMaterial({color: 0xc0392b, side: THREE.DoubleSide}); // 鲜红斜屋顶双面渲染
            const roofGeo = new THREE.ConeGeometry(22, 14, 4, 1, true); // 锥底设为 openEnded = true (无底圆盖)，一举根治屋顶闪烁 Z-Fighting
            const windowMat = new THREE.MeshLambertMaterial({
                color: 0x5dade2,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.35, // 35% 不透明度，高清晰的半透明冷蓝钢化玻璃，可以极具真实感看清窗内窗外！
                depthWrite: false // 极其关键：防止半透明窗口玻璃写入深度缓存，彻底解决隔着窗户观察时背景丧尸、机器人和野外场景变透明、被遮挡透视的 3D 经典 Bug！
            });
            const windowGeo = new THREE.BoxGeometry(0.1, 4.5, 6.0); // 窗户
            const doorMat = new THREE.MeshLambertMaterial({color: 0x5c4033, side: THREE.DoubleSide}); // 门
            const doorGeo = new THREE.BoxGeometry(6.5, 14, 0.1); // 大门加高

            // 拼装墙板几何体
            const sideSegmentGeo = new THREE.BoxGeometry(0.5, 24, 12); // 左右侧墙的前/后段墙板 (厚0.5，高24，深12)
            const sideBottomGeo = new THREE.BoxGeometry(0.5, 10, 6); // 窗洞底下挡墙
            const sideTopGeo = new THREE.BoxGeometry(0.5, 9.5, 6); // 窗洞上过梁
            const backWallGeo = new THREE.BoxGeometry(30, 24, 0.5); // 后壁
            const frontSegmentGeo = new THREE.BoxGeometry(11.75, 24, 0.5); // 正面左右短墙
            const frontHeaderGeo = new THREE.BoxGeometry(6.5, 10, 0.5); // 正门上方横梁

            // 洋房实木地板 (清除原有泥地杂草，展现完美的末日安全屋质感)
            const floorMat = new THREE.MeshLambertMaterial({color: 0x512e10, side: THREE.DoubleSide}); // 深褐色实木地板
            const floorGeo = new THREE.BoxGeometry(30, 0.4, 30);

            for(let i=0; i<housePositions.length; i++) {
                let h = housePositions[i];
                let x = h.x;
                let z = h.z;
                let y = h.baseHeight;

                const houseGroup = new THREE.Group();

                // 1. 左侧外墙 (由前段、后段、底段、顶段 4 块薄板拼接出高 4.5、深 6.0 的真实中空窗洞)
                const leftWallF = new THREE.Mesh(sideSegmentGeo, bldgBaseMat);
                leftWallF.position.set(-15, 12, 9);
                const leftWallB = new THREE.Mesh(sideSegmentGeo, bldgBaseMat);
                leftWallB.position.set(-15, 12, -9);
                const leftWallBot = new THREE.Mesh(sideBottomGeo, bldgBaseMat);
                leftWallBot.position.set(-15, 5, 0);
                const leftWallTop = new THREE.Mesh(sideTopGeo, bldgBaseMat);
                leftWallTop.position.set(-15, 19.25, 0);

                // 2. 右侧外墙 (由前段、后段、底段、顶段 4 块薄板拼接出高 4.5、深 6.0 的真实中空窗洞)
                const rightWallF = new THREE.Mesh(sideSegmentGeo, bldgBaseMat);
                rightWallF.position.set(15, 12, 9);
                const rightWallB = new THREE.Mesh(sideSegmentGeo, bldgBaseMat);
                rightWallB.position.set(15, 12, -9);
                const rightWallBot = new THREE.Mesh(sideBottomGeo, bldgBaseMat);
                rightWallBot.position.set(15, 5, 0);
                const rightWallTop = new THREE.Mesh(sideTopGeo, bldgBaseMat);
                rightWallTop.position.set(15, 19.25, 0);

                // 3. 后侧大外墙
                const backWall = new THREE.Mesh(backWallGeo, bldgBaseMat);
                backWall.position.set(0, 12, -15);

                // 4. 正面左侧段墙 (盖住 x 从 -15 到 -3.25)
                const frontWallL = new THREE.Mesh(frontSegmentGeo, bldgBaseMat);
                frontWallL.position.set(-9.125, 12, 15);

                // 5. 正面右侧段墙 (盖住 x 从 3.25 到 15)
                const frontWallR = new THREE.Mesh(frontSegmentGeo, bldgBaseMat);
                frontWallR.position.set(9.125, 12, 15);

                // 6. 正门上方横过梁 (高10，覆盖高度 14 到 24 米，形成高 14、宽 6.5 的空门洞)
                const frontHeader = new THREE.Mesh(frontHeaderGeo, bldgBaseMat);
                frontHeader.position.set(0, 19, 15);

                // 7. 铺设深色实木底地板 (高度0.2 完美贴合泥土，杜绝草叶穿出)
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.position.set(0, 0.2, 0);

                houseGroup.add(
                    leftWallF, leftWallB, leftWallBot, leftWallTop,
                    rightWallF, rightWallB, rightWallBot, rightWallTop,
                    backWall, frontWallL, frontWallR, frontHeader, floor
                );

                // 红色斜屋顶 (高14)
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 31.1; // 基座高24 + 屋顶半高7 + 0.1像素微调，完全杜绝面重合闪烁！
                roof.rotation.y = Math.PI / 4; // 旋转对齐
                houseGroup.add(roof);

                // 窗户 (大窗户精准安装在左右侧墙开好的中空窗眼内，高度 12.25)
                const winL = new THREE.Mesh(windowGeo, windowMat);
                winL.position.set(-15, 12.25, 0);
                const winR = new THREE.Mesh(windowGeo, windowMat);
                winR.position.set(15, 12.25, 0);
                houseGroup.add(winL, winR);

                // 门轴旋转系统 (门轴放在正面 z=15 墙体的左侧 x=-3.25 铰链处)
                const doorPivot = new THREE.Group();
                doorPivot.position.set(-3.25, 7.0, 15); // 大门中心高度 (14/2 = 7.0)

                // 门板网格相对于门轴向右平移半宽度
                const door = new THREE.Mesh(doorGeo, doorMat);
                door.position.set(3.25, 0, 0);
                doorPivot.add(door);
                houseGroup.add(doorPivot);

                houseGroup.position.set(x, y, z);
                scene.add(houseGroup);

                // 存储门引用，用于开合交互与防线阻挡
                doors.push({
                    pivot: doorPivot,
                    housePos: new THREE.Vector3(x, y, z),
                    isOpen: false,
                    targetAngle: 0,
                    currentAngle: 0
                });

                // 注册各薄墙体面板以及木门、屋顶、地板供射线射击检测，防止子弹穿门、穿板
                leftWallF.userData = { isBuilding: true };
                leftWallB.userData = { isBuilding: true };
                rightWallF.userData = { isBuilding: true };
                rightWallB.userData = { isBuilding: true };
                backWall.userData = { isBuilding: true };
                frontWallL.userData = { isBuilding: true };
                frontWallR.userData = { isBuilding: true };
                door.userData = { isBuilding: true }; // 门板挡子弹
                roof.userData = { isBuilding: true }; // 屋顶挡子弹
                floor.userData = { isBuilding: true }; // 地板挡子弹
                objects.push(leftWallF, leftWallB, rightWallF, rightWallB, backWall, frontWallL, frontWallR, door, roof, floor);

                // 玩家物理碰撞由 updatePlayer 的 custom AABB 精密墙壁碰撞数学算法代劳，此处无需压入 colliders 盒子，实现真正进入中空室内！
                spawnLoot(x, y, z);
            }

            // 密集的草地植被 (使用 InstancedMesh 进行海量渲染)
            const grassCount = 150000;
            const grassGeo = new THREE.ConeGeometry(1.2, 5, 3); // 简单的三角锥草丛
            grassGeo.translate(0, 2.5, 0); // 底部对齐地面
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x4a7c2e });
            const grassInstanced = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);

            const dummy = new THREE.Object3D();
            let gIdx = 0;
            for(let i=0; i<grassCount; i++) {
                let x = (Math.random() - 0.5) * mapSize;
                let z = (Math.random() - 0.5) * mapSize;
                let y = getTerrainHeight(x, z);

                // 只在草地区域生成
                if (y > 2 && y < 35) {
                    // 避开道路
                    let roadFactor = 0;
                    for(let rx = -mapSize/2; rx < mapSize/2; rx += 500) {
                        if(Math.abs(x - rx) < 25) roadFactor = 1;
                    }
                    for(let rz = -mapSize/2; rz < mapSize/2; rz += 500) {
                        if(Math.abs(z - rz) < 25) roadFactor = 1;
                    }
                    if (roadFactor === 0) {
                        // 避开洋房内部
                        let tooCloseToHouse = false;
                        for (let h of housePositions) {
                            let dx = x - h.x;
                            let dz = z - h.z;
                            if (dx*dx + dz*dz < 20 * 20) {
                                tooCloseToHouse = true;
                                break;
                            }
                        }
                        if (!tooCloseToHouse) {
                            dummy.position.set(x, y, z);
                            dummy.rotation.y = Math.random() * Math.PI;
                            dummy.scale.set(1, 0.5 + Math.random(), 1);
                            dummy.updateMatrix();
                            grassInstanced.setMatrixAt(gIdx, dummy.matrix);

                            // 不同深浅的草地颜色
                            let c = new THREE.Color();
                            if (y < 10) c.setHex(0x3d8c40);
                            else c.setHex(0x4a7c2e);
                            grassInstanced.setColorAt(gIdx, c);

                            gIdx++;
                        }
                    }
                }
            }
            grassInstanced.count = gIdx;
            scene.add(grassInstanced);
        }

        function initBots() {
            // 敌人模型更加精细化
            const bodyGeo = new THREE.BoxGeometry(3.5, 4.5, 2.5);
            const headGeo = new THREE.BoxGeometry(2.2, 2.2, 2.2);
            const packGeo = new THREE.BoxGeometry(3, 3.5, 1.5);
            const limbGeo = new THREE.BoxGeometry(1.2, 3.5, 1.2);
            const gunGeo = new THREE.BoxGeometry(0.5, 0.8, 4);

            for(let i=0; i<botCount; i++) {
                let x = (Math.random() - 0.5) * mapSize * 0.8;
                let z = (Math.random() - 0.5) * mapSize * 0.8;
                let y = 300 + Math.random() * 200; // 机器人在空中出生

                const botGroup = new THREE.Group();

                const bodyMat = new THREE.MeshLambertMaterial({color: 0x95a5a6});
                const headMat = new THREE.MeshLambertMaterial({color: 0xe0ac69});
                const limbMat = new THREE.MeshLambertMaterial({color: 0x2c3e50});

                const body = new THREE.Mesh(bodyGeo, bodyMat); body.position.y = 4.5;
                const head = new THREE.Mesh(headGeo, headMat); head.position.y = 8;
                const pack = new THREE.Mesh(packGeo, new THREE.MeshLambertMaterial({color: 0x333333})); pack.position.set(0, 5, -1.5);

                const legL = new THREE.Mesh(limbGeo, limbMat); legL.position.set(-1, 1.75, 0);
                const legR = new THREE.Mesh(limbGeo, limbMat); legR.position.set(1, 1.75, 0);
                const armL = new THREE.Mesh(limbGeo, bodyMat); armL.position.set(-2.5, 4.5, 0);
                const armR = new THREE.Mesh(limbGeo, bodyMat); armR.position.set(2.5, 4.5, 0.5); armR.rotation.x = -Math.PI / 4; // 右手抬起持枪

                const botGun = new THREE.Mesh(gunGeo, new THREE.MeshLambertMaterial({color: 0x111111}));
                botGun.position.set(2.5, 4.5, 2.5); // 枪在右手前方

                // 激光红外线（用于显示敌人的瞄准方向）
                const laserMat = new THREE.MeshBasicMaterial({color: 0xff0000, transparent: true, opacity: 0.6});
                const laserGeo = new THREE.CylinderGeometry(0.05, 0.05, 150);
                laserGeo.translate(0, 75, 0);
                laserGeo.rotateX(Math.PI / 2);
                const botLaser = new THREE.Mesh(laserGeo, laserMat);
                botLaser.position.copy(botGun.position);
                botLaser.visible = false; // 只有在开火/瞄准时显示

                botGroup.add(body, head, pack, legL, legR, armL, armR, botGun, botLaser);

                // 机器人降落伞
                const bParaGroup = new THREE.Group();
                const bCanopy = new THREE.Mesh(new THREE.SphereGeometry(10, 12, 12, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshLambertMaterial({color: 0xe74c3c, side: THREE.DoubleSide}));
                bCanopy.position.y = 12; bCanopy.scale.y = 0.5;
                bParaGroup.add(bCanopy);
                const strMat = new THREE.LineBasicMaterial({color: 0xffffff});
                for(let j=0; j<4; j++) {
                    const ang = (j/4)*Math.PI*2;
                    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(Math.cos(ang)*9, 12, Math.sin(ang)*9), new THREE.Vector3(0,5,0)]);
                    bParaGroup.add(new THREE.Line(geo, strMat));
                }
                botGroup.add(bParaGroup);

                botGroup.position.set(x, y, z);
                scene.add(botGroup);

                body.userData = { isBot: true, botIndex: i, isHeadshot: false };
                head.userData = { isBot: true, botIndex: i, isHeadshot: true };
                pack.userData = { isBot: true, botIndex: i, isHeadshot: false };
                objects.push(body, head, pack);

                // 给机器人随机配备装甲（让他们更抗揍）
                let rH = Math.random();
                let bHelmet = null;
                if(rH > 0.3) {
                    bHelmet = equipments.filter(e => e.type==="helmet")[Math.floor(Math.random()*3)];
                    headMat.color.setHex(bHelmet.color);
                }

                let rA = Math.random();
                let bArmor = null;
                if(rA > 0.3) {
                    bArmor = equipments.filter(e => e.type==="armor")[Math.floor(Math.random()*3)];
                    bodyMat.color.setHex(bArmor.color);
                }

                let w = weapons[Math.floor(Math.random() * weapons.length)];
                let diff = difficulties[currentDifficulty];

                bots.push({
                    id: i, mesh: botGroup, bodyMesh: body, headMesh: head, packMesh: pack, parachuteMesh: bParaGroup, laserMesh: botLaser,
                    health: diff.botHealth, alive: true, weapon: { ...w, damage: w.damage * diff.botDamageMultiplier },
                    helmet: bHelmet, armor: bArmor,
                    accuracy: diff.botAccuracy,
                    isParachuting: true, // 开局都在天上
                    state: 'wander', target: null, lastFire: 0, vx: 0, vz: 0, changeDirTime: 0
                });
            }
        }

        function initAnimals() {
            // 1. 初始化飞鸟 (Birds)
            const wingMat = new THREE.MeshLambertMaterial({color: 0x222222, side: THREE.DoubleSide});
            const birdBodyGeo = new THREE.ConeGeometry(0.5, 2, 4);
            const wingGeo = new THREE.BoxGeometry(0.08, 0.15, 3.5);

            for(let i=0; i<30; i++) {
                const birdGroup = new THREE.Group();

                tuskL.position.set(-0.8, 1.6, 3.2);
                tuskL.rotation.x = -Math.PI / 4;
