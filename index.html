        function spawnSingleLoot(lx, ly, lz, forceType = null) {
            let type = forceType || "ammo";
            let itemData = null;
            let color = 0xffffff;
            let geo = new THREE.BoxGeometry(2, 2, 2);

            if (type === "health") {
                color = 0xe74c3c;
            } else if (type === "ammo") {
                color = 0x27ae60;
                geo = new THREE.BoxGeometry(1.5, 1, 1);
                itemData = { name: "弹药箱 (60发)", amount: 60 };
            }

            const mat = new THREE.MeshLambertMaterial({color: color, emissive: color, emissiveIntensity: 0.4});
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(lx, ly + 1.0, lz);

            let labelName = type === 'health' ? '急救包' : '弹药箱 (60发)';
            const labelSprite = createTextSprite(labelName, type === 'health' ? '#e74c3c' : '#2ecc71');
            labelSprite.position.set(0, 1.8, 0);
            mesh.add(labelSprite);

            scene.add(mesh);
            lootItems.push({ mesh: mesh, type: type, data: itemData });
        }

        function initZombies() {
            const bodyGeo = new THREE.BoxGeometry(3.2, 4.5, 2.2);
            const headGeo = new THREE.BoxGeometry(2.0, 2.0, 2.0);
            const armGeo = new THREE.BoxGeometry(1.0, 3.5, 1.0);
            const legGeo = new THREE.BoxGeometry(1.1, 3.5, 1.1);

            // 皮肤墨绿，衣服带有血污，不规则鲜红撕裂伤口 (采用自发光 Emissive 材质，防止在雷暴雨黑影下隐形透明)
            const zombieSkinMat = new THREE.MeshLambertMaterial({
                color: 0x2d3b2a,
                emissive: 0x182617, // 墨绿色自发光，在阴影暗光中依然清晰可见，且极具惊悚荧光质感！
                emissiveIntensity: 0.5,
                side: THREE.DoubleSide
            });
            const zombieClothMat = new THREE.MeshLambertMaterial({
                color: 0x5a1818,
                emissive: 0x2a0c0c, // 暗红衣服自发光
                emissiveIntensity: 0.5,
                side: THREE.DoubleSide
            });
            const zombieDetailMat = new THREE.MeshLambertMaterial({
                color: 0x8b0000,
                emissive: 0x4a0000, // 爆血口部/伤口自发光，十分吓人！
                emissiveIntensity: 0.6,
                side: THREE.DoubleSide
            });
            const eyeMat = new THREE.MeshBasicMaterial({color: 0xeeff77}); // 昏黄惊悚双眼

            // 丧尸总数增加到 100 只，大幅提升战斗张力
            for(let i=0; i<100; i++) {
                const zombieGroup = new THREE.Group();

                let x, z;
                if (i < 75 && housePositions.length > 0) {
                    // 75% 的大半丧尸会锚定并扎堆在随机一座洋房周围 15 - 45 距离内 (丧尸城镇感染区)
                    let house = housePositions[Math.floor(Math.random() * housePositions.length)];
                    let angle = Math.random() * Math.PI * 2;
                    let dist = 15 + Math.random() * 30;
                    x = house.x + Math.cos(angle) * dist;
                    z = house.z + Math.sin(angle) * dist;
                } else {
                    // 25% 散落在大森林里
                    x = (Math.random() - 0.5) * mapSize * 0.75;
                    z = (Math.random() - 0.5) * mapSize * 0.75;
                }

                let y = getTerrainHeight(x, z);
                if (y < 2) {
                    i--; // 水中避开，重新生成选点
                    continue;
                }

                // 墙体 base
                const body = new THREE.Mesh(bodyGeo, zombieClothMat);
                body.position.y = 4.5;

                // 头部
                const head = new THREE.Mesh(headGeo, zombieSkinMat);
                head.position.y = 7.75;

                // 贴在脸颊上的恐怖伤口
                const bloodWound = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.2), zombieDetailMat);
                bloodWound.position.set(0.4, 7.75, 1.0);

                // 发光的恐怖眼睛
                const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.2), eyeMat);
                eyeL.position.set(-0.5, 8.2, 0.95);
                const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.2), eyeMat);
                eyeR.position.set(0.5, 8.2, 0.95);

                // 丧尸前平伸双手 (经典惊悚姿态)
                const armL = new THREE.Mesh(armGeo, zombieSkinMat);
                armL.position.set(-2.2, 4.5, 1.25);
                armL.rotation.x = -Math.PI / 2.2;
                const armR = new THREE.Mesh(armGeo, zombieSkinMat);
                armR.position.set(2.2, 4.5, 1.25);
                armR.rotation.x = -Math.PI / 1.8;

                const legL = new THREE.Mesh(legGeo, zombieClothMat);
                legL.position.set(-0.9, 1.75, 0);
                const legR = new THREE.Mesh(legGeo, zombieClothMat);
                legR.position.set(0.9, 1.75, 0);

                // 双层嵌套 Group 架构：建立子组 zombieModel，专门负责跑动中的欧拉角 .rotation.z 左右晃动
                const zombieModel = new THREE.Group();
                zombieModel.add(body, head, bloodWound, eyeL, eyeR, armL, armR, legL, legR);
                zombieGroup.add(zombieModel); // 外层父组 zombieGroup 专门负责 .lookAt 朝向旋转，两者互不穿干扰，从图学数学上彻底消灭万向锁 Euler Singularity 奇异点隐形Bug！

                zombieGroup.position.set(x, y, z);
                scene.add(zombieGroup);

                // 100% 禁用所有子网格的视锥裁剪，防止 WebGL 在特定边缘观察角度下将丧尸裁切过滤导致隐形
                zombieGroup.traverse(child => {
                    if (child.isMesh) {
                        child.frustumCulled = false;
                    }
                });

                // 注册到射线射击检测中 (精确绑定数组长度，修复由于 continue 导致的隔空瞬移消失 Bug)
                body.userData = { isZombie: true, zombieIndex: zombies.length, isHeadshot: false };
                head.userData = { isZombie: true, zombieIndex: zombies.length, isHeadshot: true };
                bloodWound.userData = { isZombie: true, zombieIndex: zombies.length, isHeadshot: true };
                objects.push(body, head, bloodWound);

                zombies.push({
                    id: zombies.length,
                    mesh: zombieGroup,
                    modelMesh: zombieModel, // 存储内层模型子组引用
                    bodyMesh: body,
                    headMesh: head,
                    bloodWound: bloodWound,
                    legL, legR,
                    health: 110, // 血量从180下调至110，击杀难度降低，更爽快
                    alive: true,
                    speed: 18 + Math.random() * 5, // 速度下调 (原本26+8)，玩家按Shift加速奔跑可以甩开
                    lastAttack: 0,
                    changeDirTime: 0,
                    target: null,
                    vx: 0, vz: 0
                });
            }
        }

        function updateZombies(delta) {
            let now = Date.now();
            let playerPos = controls.getObject().position;

            zombies.forEach(zombie => {
                if (!zombie.alive) return;

                let zPos = zombie.mesh.position;

                // 如果当前追捕玩家，而玩家躲进了关着门的避难屋里，丧尸立刻失去目标并游走
                if (zombie.target === 'player') {
                    let insideHouse = getHousePlayerIsInside();
                    if (insideHouse && !insideHouse.isOpen) {
                        zombie.target = null;
                        zombie.changeDirTime = 0; // 瞬间进入漫游/搜寻其他Bot状态
                    }
                }

                // 轮询搜索 400 码内的目标
                if (now > zombie.changeDirTime) {
                    zombie.changeDirTime = now + 1000 + Math.random() * 1000;

                    let minDistSq = 400 * 400;
                    let closestTarget = null;

                    if (player.alive && !player.isParachuting) {
                        let insideHouse = getHousePlayerIsInside();
                        let targetable = true;
                        if (insideHouse && !insideHouse.isOpen) {
                            targetable = false; // 门关着，玩家在屋内，丧尸完全看不见也听不着玩家！
                        }
                        if (targetable) {
                            let dSq = zPos.distanceToSquared(playerPos);
                            if (dSq < minDistSq) {
                                minDistSq = dSq;
                                closestTarget = 'player';
                            }
                        }
                    }

                    bots.forEach(bot => {
                        if (bot.alive && !bot.isParachuting) {
                            let dSq = zPos.distanceToSquared(bot.mesh.position);
                            if (dSq < minDistSq) {
                                minDistSq = dSq;
                                closestTarget = bot;
                            }
                        }
                    });

                    zombie.target = closestTarget;

                    if (!zombie.target) {
                        // 迷路游走
                        let angle = Math.random() * Math.PI * 2;
                        let s = 10 + Math.random() * 5;
                        zombie.vx = Math.cos(angle) * s;
                        zombie.vz = Math.sin(angle) * s;
                    }
                }

                // 惊悚追逐
                if (zombie.target) {
                    let targetPos = zombie.target === 'player' ? playerPos : zombie.target.mesh.position;
                    let dir = new THREE.Vector3().subVectors(targetPos, zPos);
                    dir.y = 0;
                    let dist = dir.length();
                    dir.normalize();

                    zombie.vx = dir.x * zombie.speed;
                    zombie.vz = dir.z * zombie.speed;

                    zombie.mesh.lookAt(targetPos.x, zPos.y, targetPos.z);

                    // 左右颠簸挣扎跑姿 (由内层子组 modelMesh 控制，100% 杜绝与父组 lookAt 四元数产生 Euler 万向锁翻转奇异点！)
                    zombie.modelMesh.rotation.z = Math.sin(now * 0.015) * 0.08;

                    // 惊悚追逐时，有 0.4% 的微小概率发出喉咙里咔咔颤抖的 3D 恐怖怒吼声
                    if (Math.random() < 0.004) {
                        playZombieSound('growl', {x: zPos.x, y: zPos.y, z: zPos.z});
                    }

                    // 咬人抓挠
                    if (dist < 6.0) {
                        zombie.vx = 0; zombie.vz = 0; // 站定撕咬

                        // 隔墙攻击拦截逻辑：计算丧尸和啃咬目标分别身处哪栋房屋内部
                        let targetHouse = zombie.target === 'player' ? getHousePlayerIsInside() : getHouseObjectIsInside(zombie.target.mesh.position);
                        let zombieHouse = getHouseObjectIsInside(zPos);
                        if (targetHouse !== zombieHouse) {
                            return; // 隔墙咬人阻断！如果一个在屋外，另一个在屋内，绝对不允许穿墙撕咬！
                        }

                        if (now - zombie.lastAttack > 1400) { // 啃咬频率从 0.8s 下调至 1.4s，给玩家反应余地
                            zombie.lastAttack = now;

                            // 喷溅大红血粒子
                            spawnBlood(zPos.clone().add(new THREE.Vector3(0, 4.5, 1)), new THREE.Vector3(0, 1, 0));

                            if (zombie.target === 'player') {
                                playerHit(12); // 啃咬伤害从35下调至12，生存体验大大好转！
                                playZombieSound('bite'); // 播放撕咬音效
                                showNotice("⚠️ 您被丧尸抓咬了！(-12 HP)", "#e74c3c");
                            } else {
                                zombie.target.health -= 15; // 撕咬机器人的伤害调至 15
                                playZombieSound('bite', { x: zombie.target.mesh.position.x, y: zombie.target.mesh.position.y, z: zombie.target.mesh.position.z });
                                spawnBlood(zombie.target.mesh.position.clone().add(new THREE.Vector3(0, 4, 0)), new THREE.Vector3(0, 1, 0));
                                if (zombie.target.health <= 0) {
                                    botDied(zombie.target, "丧尸 (Zombie)");
                                    zombie.target = null;
                                    zombie.changeDirTime = 0;
                                }
                            }
                        }
                    }
                } else {
                    zombie.modelMesh.rotation.z = 0;
                }

                // 物理位移 (带有大洋房墙体、门板 AABB 碰撞阻拦判定)
                let oldZx = zPos.x, oldZz = zPos.z;
                zPos.x += zombie.vx * delta;
                zPos.z += zombie.vz * delta;
                zPos.y = getTerrainHeight(zPos.x, zPos.z);

                // 丧尸绝对空间结界拦截：任何洋房内部均为丧尸物理禁区，100% 禁止任何丧尸跨过门槛或穿入室内
                let inHouse = getHouseObjectIsInside(zPos);
                if (inHouse) {
                    zPos.x = oldZx;
                    zPos.z = oldZz;
                    zPos.y = getTerrainHeight(zPos.x, zPos.z);
                }

                // 丧尸与所有洋房墙体、门板的 AABB 盒子物理碰撞阻挡 (防线阻断)
                for (let i = 0; i < doors.length; i++) {
                    let d = doors[i];
                    let hPos = d.housePos;
                    let dx = zPos.x - hPos.x;
                    let dz = zPos.z - hPos.z;
                    let dy = zPos.y - hPos.y;

                    if (dy > 0 && dy < 24) {
                        let absX = Math.abs(dx);
                        let absZ = Math.abs(dz);

                        if (absX < 16.2 && absZ < 16.2) {
                            let wallHit = false;

                            if ((dx >= -16.2 && dx <= -13.5 && dz >= -16.2 && dz <= 16.2) || // 左侧墙壁
                                (dx >= 13.5 && dx <= 16.2 && dz >= -16.2 && dz <= 16.2) ||  // 右侧墙壁
                                (dz >= -16.2 && dz <= -13.5 && dx >= -16.2 && dx <= 16.2) || // 后侧墙壁
                                (dz >= 13.5 && dz <= 16.2 && dx >= -16.2 && dx <= -3.1) ||  // 正面左门框
                                (dz >= 13.5 && dz <= 16.2 && dx >= 3.1 && dx <= 16.2) ||   // 正面右门框
                                (!d.isOpen && dz >= 13.5 && dz <= 16.2 && dx >= -3.25 && dx <= 3.25)) { // 关门阻拦
                                wallHit = true;
                            }

                            if (wallHit) {
                                zPos.x = oldZx;
                                zPos.z = oldZz;
                                break;
                            }
                        }
                    }
                }

                // 摆腿
                let moveSpeedSq = zombie.vx * zombie.vx + zombie.vz * zombie.vz;
                if (moveSpeedSq > 1) {
                    let freq = zombie.target ? 0.02 : 0.01;
                    let swing = Math.sin(now * freq) * 0.55;
                    zombie.legL.rotation.x = swing;
                    zombie.legR.rotation.x = -swing;
                } else {
                    zombie.legL.rotation.x = 0;
                    zombie.legR.rotation.x = 0;
                }
            });
        }

        function zombieDied(zombie) {
            if (!zombie.alive) return;
            zombie.alive = false;
            scene.remove(zombie.mesh);

            // 从 objects 射线检测列表中移除
            let idx1 = objects.indexOf(zombie.bodyMesh);
            if(idx1 > -1) objects.splice(idx1, 1);
            let idx2 = objects.indexOf(zombie.headMesh);
            if(idx2 > -1) objects.splice(idx2, 1);
            let idx3 = objects.indexOf(zombie.bloodWound);
            if(idx3 > -1) objects.splice(idx3, 1);

            player.kills++;
            showNotice("击杀血腥丧尸！(+1 击杀)", "#e74c3c");

            // 原地 80% 掉落医疗包或弹药箱
            let r = Math.random();
            if (r < 0.4) {
                spawnSingleLoot(zombie.mesh.position.x, zombie.mesh.position.y, zombie.mesh.position.z, 'health');
            } else if (r < 0.8) {
                spawnSingleLoot(zombie.mesh.position.x, zombie.mesh.position.y, zombie.mesh.position.z, 'ammo');

            addKillFeed(`[You] 击杀了一只 [血腥丧尸]`);

        // --- 恐怖元素：幽灵 ---
        function initGhosts() {
            const ghostMat = new THREE.MeshBasicMaterial({
                color: 0xccffff,
                transparent: true,
                opacity: 0.0, // 初始透明，幽灵会在玩家附近忽隐忽现
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            // 斗篷
            const bodyGeo = new THREE.ConeGeometry(2, 8, 16, 1, true);
            bodyGeo.translate(0, -1, 0); // 中心点上移

            // 头
            const headGeo = new THREE.SphereGeometry(2, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            headGeo.translate(0, 3, 0);

            // 黑洞洞的眼睛
            const eyeMat = new THREE.MeshBasicMaterial({color: 0x000000, side: THREE.DoubleSide});
            const eyeGeo = new THREE.PlaneGeometry(0.5, 0.8);

            for (let i = 0; i < 30; i++) {
                const ghostGroup = new THREE.Group();
                const body = new THREE.Mesh(bodyGeo, ghostMat.clone());
                const head = new THREE.Mesh(headGeo, ghostMat.clone());

                const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
                eyeL.position.set(-0.6, 3.5, 1.95);
                const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
                eyeR.position.set(0.6, 3.5, 1.95);

                ghostGroup.add(body, head, eyeL, eyeR);

                let x = (Math.random() - 0.5) * mapSize * 0.9;
                let z = (Math.random() - 0.5) * mapSize * 0.9;
                let y = getTerrainHeight(x, z) + 5;

                ghostGroup.position.set(x, y, z);
                scene.add(ghostGroup);

                ghosts.push({
                    mesh: ghostGroup,
                    bodyMesh: body,
                    headMesh: head,
                    x: x, z: z, originY: y,
                    timeOffset: Math.random() * 100,
                    targetOpacity: 0.0,
                    currentOpacity: 0.0,
                    state: 'hidden', // 'hidden', 'appearing', 'visible', 'vanishing'
                    stateTimer: 0
                });
            }
        }

        // 幽灵低语恐怖音效合成
        function playGhostWhisper(pos) {
            if(!audioCtx || audioCtx.state === 'suspended') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 2.0);

            // 高频调制带来诡异的“空灵”听感
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 6;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 50;
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);

            filter.type = 'bandpass';
            filter.frequency.value = 400;

            osc.connect(filter);
            filter.connect(gain);

            const panner = audioCtx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'exponential';
            panner.refDistance = 10;
            panner.maxDistance = 300;
            panner.rolloffFactor = 1.0;

            panner.positionX.value = pos.x;
            panner.positionY.value = pos.y;
            panner.positionZ.value = pos.z;

            gain.connect(panner);
            panner.connect(audioCtx.destination);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(1.5, now + 1.0);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);

            lfo.start(now);
            osc.start(now);
            lfo.stop(now + 3.0);
            osc.stop(now + 3.0);
        }

        function updateGhosts(delta) {
            let playerPos = controls.getObject().position;

            ghosts.forEach(ghost => {
                ghost.timeOffset += delta;
                let dSq = ghost.mesh.position.distanceToSquared(playerPos);

                // 距离玩家 150 米以内，有几率显现
                if (dSq < 150 * 150) {
                    if (ghost.state === 'hidden' && Math.random() < 0.005) {
                        ghost.state = 'appearing';
                        ghost.targetOpacity = 0.5 + Math.random() * 0.3;
                        ghost.stateTimer = 5 + Math.random() * 5; // 显示 5-10 秒
                        playGhostWhisper(ghost.mesh.position);

                        // 瞬移到玩家背后的随机位置
                        let angle = Math.random() * Math.PI * 2;
                        let dist = 15 + Math.random() * 30;
                        ghost.x = playerPos.x + Math.cos(angle) * dist;
                        ghost.z = playerPos.z + Math.sin(angle) * dist;
                        ghost.originY = getTerrainHeight(ghost.x, ghost.z) + 5;
                    }
                } else {
                    if (ghost.state !== 'hidden' && ghost.state !== 'vanishing') {
                        ghost.state = 'vanishing';
                    }
                }

                if (ghost.state === 'appearing') {
                    ghost.currentOpacity = THREE.MathUtils.lerp(ghost.currentOpacity, ghost.targetOpacity, delta * 2);
                    ghost.stateTimer -= delta;
                    if (ghost.stateTimer <= 0) ghost.state = 'vanishing';
                } else if (ghost.state === 'vanishing') {
                    ghost.currentOpacity = THREE.MathUtils.lerp(ghost.currentOpacity, 0, delta * 1.5);
                    if (ghost.currentOpacity < 0.01) {
                        ghost.currentOpacity = 0;
                        ghost.state = 'hidden';
                    }
                }

                ghost.bodyMesh.material.opacity = ghost.currentOpacity;
                ghost.headMesh.material.opacity = ghost.currentOpacity;

                if (ghost.currentOpacity > 0) {
                    // 幽灵上下漂浮，并缓慢向玩家移动
                    ghost.mesh.position.y = ghost.originY + Math.sin(ghost.timeOffset * 2) * 2;

                    let dirX = playerPos.x - ghost.x;
                    let dirZ = playerPos.z - ghost.z;
                    let len = Math.sqrt(dirX*dirX + dirZ*dirZ);
                    if (len > 0) {
                        ghost.x += (dirX / len) * delta * 4; // 缓慢飘近
                        ghost.z += (dirZ / len) * delta * 4;
                    }
                    ghost.mesh.position.x = ghost.x;
                    ghost.mesh.position.z = ghost.z;

                    // 永远盯着玩家
                    ghost.mesh.lookAt(playerPos.x, ghost.mesh.position.y, playerPos.z);
                }
            });
        }

        function updateAnimals(delta) {
            let now = Date.now();
            let playerPos = controls.getObject().position;

            // 1. 更新飞鸟动画与运动
            birds.forEach(bird => {
                bird.angle += bird.speed * delta;
                let bx = bird.cx + Math.cos(bird.angle) * bird.radius;
                let bz = bird.cz + Math.sin(bird.angle) * bird.radius;

                bird.mesh.position.set(bx, bird.cy, bz);
                // 沿着切线方向面向
                bird.mesh.rotation.y = -bird.angle;

                // 翅膀扇动 (正弦上下振动)
                let wingAngle = Math.sin(now * 0.016) * 0.55;
                bird.wingL.rotation.z = wingAngle;
                bird.wingR.rotation.z = -wingAngle;
            });

            // 2. 更新梅花鹿游走与避险 AI
            deers.forEach(deer => {
                if (!deer.alive) return;

                let dPos = deer.mesh.position;
                let distToPlayerSq = dPos.distanceToSquared(playerPos);

                if (distToPlayerSq < 55 * 55) { // 55 米感知圈，玩家一靠近就疯狂逃窜
                    deer.state = 'flee';
                    deer.fearCooldown = now + 4000; // 受到惊吓至少逃跑4秒
                } else if (now > deer.fearCooldown) {
                    deer.state = 'wander';
                }

                if (deer.state === 'flee') {
                    // 朝玩家相反方向奔跑
                    let dir = new THREE.Vector3().subVectors(dPos, playerPos);
                    dir.y = 0;
                    dir.normalize();
                    let fleeSpeed = 48; // 极其迅猛

                    deer.vx = dir.x * fleeSpeed;
                    deer.vz = dir.z * fleeSpeed;

                    deer.mesh.lookAt(dPos.x + deer.vx, dPos.y, dPos.z + deer.vz);
                } else { // wander
                    if (now > deer.changeDirTime) {
                        deer.changeDirTime = now + 2000 + Math.random() * 4500;
                        let angle = Math.random() * Math.PI * 2;
                        let wanderSpeed = 4 + Math.random() * 8;
                        deer.vx = Math.cos(angle) * wanderSpeed;
                        deer.vz = Math.sin(angle) * wanderSpeed;
                    }
                    if (Math.abs(deer.vx) > 0.1 || Math.abs(deer.vz) > 0.1) {
                        deer.mesh.lookAt(dPos.x + deer.vx, dPos.y, dPos.z + deer.vz);
                    }
                }

                // 物理坐标更新
                dPos.x += deer.vx * delta;
                dPos.z += deer.vz * delta;
                dPos.y = getTerrainHeight(dPos.x, dPos.z);

                // 越界保护
                if (Math.abs(dPos.x) > mapSize/2 || Math.abs(dPos.z) > mapSize/2) {
                    dPos.x = (Math.random() - 0.5) * mapSize * 0.4;
                    dPos.z = (Math.random() - 0.5) * mapSize * 0.4;
                    dPos.y = getTerrainHeight(dPos.x, dPos.z);
                }

                // 梅花鹿跑步摆腿动画
                let moveSpeedSq = deer.vx * deer.vx + deer.vz * deer.vz;
                if (moveSpeedSq > 1) {
                    let swingFreq = deer.state === 'flee' ? 0.024 : 0.012;
                    let swing = Math.sin(now * swingFreq) * 0.65;
                    deer.legFL.rotation.x = swing;
                    deer.legFR.rotation.x = -swing;
                    deer.legBL.rotation.x = -swing;
                    deer.legBR.rotation.x = swing;
                } else {
                    deer.legFL.rotation.x = 0;
                    deer.legFR.rotation.x = 0;
                    deer.legBL.rotation.x = 0;
                    deer.legBR.rotation.x = 0;
                }
            });

            // 3. 更新野猪冲锋与撞击 AI
            boars.forEach(boar => {
                if (!boar.alive) return;

                let bPos = boar.mesh.position;
                let distToPlayer = bPos.distanceTo(playerPos);

                if (distToPlayer < 35 && now > boar.chargeCooldown) {
                    boar.state = 'charge';
                } else if (boar.state === 'charge' && distToPlayer > 80) {
                    boar.state = 'wander';
                }

                if (boar.state === 'charge') {
                    // 愤怒冲向玩家
                    let dir = new THREE.Vector3().subVectors(playerPos, bPos);
                    dir.y = 0;
                    dir.normalize();
                    let chargeSpeed = 38; // 愤怒暴冲

                    boar.vx = dir.x * chargeSpeed;
                    boar.vz = dir.z * chargeSpeed;

                    boar.mesh.lookAt(playerPos.x, bPos.y, playerPos.z);

                    // 冲撞到玩家
                    if (distToPlayer < 5.0) {
                        boar.state = 'wander';
                        boar.chargeCooldown = now + 4000; // 冲锋击中后进入4秒冷却
                        boar.vx = -dir.x * 15; // 撞人后反弹
                        boar.vz = -dir.z * 15;

                        playerHit(12); // 造成12点伤害
                        showNotice("💥 警告！您被愤怒的野猪狠狠撞击！(-12 HP)", "#f39c12");
                    }
                } else { // wander
                    if (now > boar.changeDirTime) {
                        boar.changeDirTime = now + 1500 + Math.random() * 3500;
                        let angle = Math.random() * Math.PI * 2;
                        let wanderSpeed = 3 + Math.random() * 6;
                        boar.vx = Math.cos(angle) * wanderSpeed;
                        boar.vz = Math.sin(angle) * wanderSpeed;
                    }
                    if (Math.abs(boar.vx) > 0.1 || Math.abs(boar.vz) > 0.1) {
                        boar.mesh.lookAt(bPos.x + boar.vx, bPos.y, bPos.z + boar.vz);
                    }
                }

                // 物理坐标更新
                bPos.x += boar.vx * delta;
                bPos.z += boar.vz * delta;
                bPos.y = getTerrainHeight(bPos.x, bPos.z);

                // 越界保护
                if (Math.abs(bPos.x) > mapSize/2 || Math.abs(bPos.z) > mapSize/2) {
                    bPos.x = (Math.random() - 0.5) * mapSize * 0.4;
                    bPos.z = (Math.random() - 0.5) * mapSize * 0.4;
                    bPos.y = getTerrainHeight(bPos.x, bPos.z);
                }

                // 野猪跑腿动画
                let moveSpeedSq = boar.vx * boar.vx + boar.vz * boar.vz;
                if (moveSpeedSq > 1) {
                    let swingFreq = boar.state === 'charge' ? 0.022 : 0.012;
                    let swing = Math.sin(now * swingFreq) * 0.55;
                    boar.legFL.rotation.x = swing;
                    boar.legFR.rotation.x = -swing;
                    boar.legBL.rotation.x = -swing;
                    boar.legBR.rotation.x = swing;
                } else {
                    boar.legFL.rotation.x = 0;
                    boar.legFR.rotation.x = 0;
                    boar.legBL.rotation.x = 0;
                    boar.legBR.rotation.x = 0;
                }
            });
        }

        function killAnimal(animal, animalType) {
            if (!animal.alive) return;
            animal.alive = false;
            scene.remove(animal.mesh);

            // 从 objects 射线检测列表中移除
            let idx1 = objects.indexOf(animal.bodyMesh);
            if(idx1 > -1) objects.splice(idx1, 1);
            let idx2 = objects.indexOf(animal.headMesh);
            if(idx2 > -1) objects.splice(idx2, 1);

            let animalCN = animalType === 'deer' ? '梅花鹿' : '野生野猪';
            showNotice(`击杀了 [${animalCN}]！生存补给已掉落！`, "#2ecc71");

            // 100% 掉落包
            let r = Math.random();
            if (r < 0.5) {
                spawnSingleLoot(animal.mesh.position.x, animal.mesh.position.y, animal.mesh.position.z, 'health');
            } else {
                spawnSingleLoot(animal.mesh.position.x, animal.mesh.position.y, animal.mesh.position.z, 'ammo');
            }

            addKillFeed(`[You] 击杀了一只 [${animalCN}]`);
            updateUI();
        }

        // --- 控制逻辑 ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false, isSprinting = false, isMouseDown = false;
        let interactKey = false;
        const velocity = new THREE.Vector3(), direction = new THREE.Vector3();

        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump && !player.isParachuting) { velocity.y += 120; canJump = false; } break;
                case 'ShiftLeft': isSprinting = true; break;
                case 'KeyF': interactKey = true; break;
                case 'KeyR': reloadWeapon(); break;
                case 'Digit1': case 'Numpad1': event.preventDefault(); switchWeapon(0); break;
                case 'Digit2': case 'Numpad2': event.preventDefault(); switchWeapon(1); break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
                case 'ShiftLeft': isSprinting = false; break;
                case 'KeyF': interactKey = false; break;
            }
        });

        function switchWeapon(index) {
            if(player.inventory[index] && player.currentWeaponIndex !== index) {
                cancelReload();
                player.currentWeaponIndex = index;
                player.weapon = player.inventory[index];
                player.isADS = false;
                player.recoilY = 0;
                document.getElementById('scope-overlay').style.display = 'none';
                camera.fov = 75;
                camera.updateProjectionMatrix();
                // 重置武器位置
                if(viewWeaponMesh) {
                    viewWeaponMesh.position.set(0.6, -0.6, -1.2);
                    viewWeaponMesh.rotation.set(0, 0, 0);
                }
                updateWeaponModel();
                updateUI();
                showNotice("切换武器: " + player.weapon.name, "#f1c40f");
            }
        }

        function equipWeapon(index) {
            cancelReload();
            player.currentWeaponIndex = index;
            player.weapon = player.inventory[index];
            player.isADS = false;
            player.recoilY = 0;
            document.getElementById('scope-overlay').style.display = 'none';
            camera.fov = 75;
            camera.updateProjectionMatrix();
            // 重置武器位置
            if(viewWeaponMesh) {
                viewWeaponMesh.position.set(0.6, -0.6, -1.2);
                viewWeaponMesh.rotation.set(0, 0, 0);
            }
            updateWeaponModel();
            updateUI();
        }

        let reloadTimeout = null;
        let reloadStartTime = 0;
        const RELOAD_DURATION = 2000; // 2秒换弹
        let isReloadingAnim = false; // 换弹动画状态
        let reloadAnimPhase = 0; // 0:拉枪机 1:装填 2:放回

        function reloadWeapon() {
            if (player.isReloading || !player.weapon) return;

            const needed = player.weapon.maxAmmo - player.weapon.ammo;
            const available = player.sharedAmmo;

            if (needed <= 0) {
                showNotice("弹匣已满!", "#2ecc71");
                return;
            }
            if (available <= 0) {
                showNotice("没有备用子弹!", "#e74c3c");
                return;
            }

            player.isReloading = true;
            reloadStartTime = Date.now();
            document.getElementById('reload-bar-bg').style.display = 'block';
            document.getElementById('reload-bar').style.width = '0%';

            reloadTimeout = setTimeout(() => {
                // 计算实际能补充多少子弹（中途可能被消耗）
                const finalNeeded = player.weapon.maxAmmo - player.weapon.ammo;
                const toReload = Math.min(finalNeeded, player.sharedAmmo);
                player.weapon.ammo += toReload;
                player.sharedAmmo -= toReload;
                player.isReloading = false;
                document.getElementById('reload-bar-bg').style.display = 'none';
                // 重置武器位置
                if(viewWeaponMesh) {
                    viewWeaponMesh.position.set(0.6, -0.6, -1.2);
                    viewWeaponMesh.rotation.set(0, 0, 0);
                }
                updateUI();
                showNotice(`换弹完成! +${toReload}`, "#2ecc71");
            }, RELOAD_DURATION);
        }

        function cancelReload() {
            if (reloadTimeout) {
                clearTimeout(reloadTimeout);
                reloadTimeout = null;
            }
            player.isReloading = false;
            document.getElementById('reload-bar-bg').style.display = 'none';
            // 恢复武器位置
            if(viewWeaponMesh) {
                viewWeaponMesh.position.set(0.6, -0.6, -1.2);
                viewWeaponMesh.rotation.set(0, 0, 0);
            }
        }

        document.addEventListener('mousedown', (e) => {
            if(!controls.isLocked) return;
            if (e.button === 0) { // 左键
                isMouseDown = true;
                if(player.isReloading) cancelReload();
                if(player.weapon.fireRate > 200) fireWeapon();
            } else if (e.button === 2) { // 右键：切换开镜
                player.isADS = !player.isADS;
            }
        });
        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) isMouseDown = false;
        });

        // --- 核心更新逻辑 ---
        function calcDamage(baseDmg, isHeadshot, targetObj) {
            let dmg = baseDmg;
            if(isHeadshot) {
                dmg *= 2.5; // 爆头2.5倍
                if(targetObj.helmet) dmg *= (1 - targetObj.helmet.reduction);
            } else {
                if(targetObj.armor) dmg *= (1 - targetObj.armor.reduction);
            }
            return dmg;
        }

        function updatePlayer(delta) {
            if (!player.alive) return;

            let pPos = controls.getObject().position;

            if (player.isParachuting) {
                let fallSpeed = isSprinting ? -120 : -35;
                velocity.y = fallSpeed;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveLeft) - Number(moveRight);
                direction.normalize();

                let speed = 80;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                velocity.x -= velocity.x * 1.5 * delta;
                velocity.z -= velocity.z * 1.5 * delta;

                controls.moveRight(velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                pPos.y += velocity.y * delta;

                let groundY = getTerrainHeight(pPos.x, pPos.z) + 10;

                // 降落伞判定落在屋顶上
                for (let i = 0; i < housePositions.length; i++) {
                    let hPos = housePositions[i];
                    let dx = Math.abs(pPos.x - hPos.x);
                    let dz = Math.abs(pPos.z - hPos.z);
                    if (dx <= 15.6 && dz <= 15.6) {
                        let roofSurfaceY = hPos.baseHeight + 38.1 - 14 * (Math.max(dx, dz) / 15.556);
                        if (roofSurfaceY + 10 > groundY) {
                            groundY = roofSurfaceY + 10;
                        }
                    }
                }

                // 降落伞判定落在石头或树顶
                let pBoxPara = new THREE.Box3().setFromCenterAndSize(pPos, new THREE.Vector3(1, 10, 1));
                for (let box of colliders) {
                    if (pBoxPara.intersectsBox(box)) {
                        if (box.max.y + 10 > groundY) {
                            groundY = box.max.y + 10;
                        }
                    }
                }

                if (pPos.y <= groundY) {
                    pPos.y = groundY;
                    player.isParachuting = false;
                    if(parachuteGroup) parachuteGroup.visible = false;
                    showNotice("已落地！快去房屋或石头附近寻找装备！", "#4caf50");
                    updateUI();
                }
            } else {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 40.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveLeft) - Number(moveRight);
                direction.normalize();

                let speed = isSprinting ? 600 : 350;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                let oldX = pPos.x, oldY = pPos.y, oldZ = pPos.z;

                // 限制最大速度防止抖动
                velocity.x = Math.max(-300, Math.min(300, velocity.x));
                velocity.z = Math.max(-300, Math.min(300, velocity.z));

                // --- 阶段一：水平 X/Z 物理位移与碰撞拦截 ---
                controls.moveRight(velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // 1. 玩家与树木、石头世界碰撞盒的 水平 X/Z 阻碍拦截
                let pBoxXZ = new THREE.Box3().setFromCenterAndSize(pPos, new THREE.Vector3(3, 10, 3));
                let hitColliderXZ = false;
                for(let box of colliders) {
                    if(pBoxXZ.intersectsBox(box)) {
                        // 仅当玩家的高度处于障碍物顶部以下时（即玩家撞击的是树干或石头侧面），才进行水平物理拦截
                        // 玩家高度 10 米，眼睛中心在 y 轴中点，脚底相当于 pPos.y - 5.0。box.max.y 为障碍物顶部高度
                        if (pPos.y - 4.5 < box.max.y) {
                            hitColliderXZ = true;
                            break;
                        }
                    }
                }

                if (hitColliderXZ || Math.abs(pPos.x) > mapSize/2 || Math.abs(pPos.z) > mapSize/2) {
                    pPos.x = oldX;
                    pPos.z = oldZ; // 仅仅在水平方向上被推回阻挡，不再对 Y 轴锁死，彻底解除卡顿！
                }

                // 2. 玩家与所有房屋墙体、门板的 AABB 盒子物理碰撞判定 (30x24x30 尺寸，水平阻挡)
                for (let i = 0; i < doors.length; i++) {
                    let d = doors[i];
                    let hPos = d.housePos;
                    let dx = pPos.x - hPos.x;
                    let dz = pPos.z - hPos.z;
                    let dy = pPos.y - hPos.y;

                    // 仅当玩家处于房屋高度（0 到 24 米）内，才进行碰撞阻拦
                    if (dy > 0 && dy < 24) {
                        let absX = Math.abs(dx);
                        let absZ = Math.abs(dz);

                        // 30x30 房屋尺寸，碰撞判定判定外廓为 16.2
                        if (absX < 16.2 && absZ < 16.2) {
                            let wallHit = false;

                            // 1. 左侧墙壁 AABB 碰撞体
                            if (dx >= -16.2 && dx <= -13.5 && dz >= -16.2 && dz <= 16.2) {
                                wallHit = true;
                            }
                            // 2. 右侧墙壁 AABB 碰撞体
                            else if (dx >= 13.5 && dx <= 16.2 && dz >= -16.2 && dz <= 16.2) {
                                wallHit = true;
                            }
                            // 3. 后侧墙壁 AABB 碰撞体
                            else if (dz >= -16.2 && dz <= -13.5 && dx >= -16.2 && dx <= 16.2) {
                                wallHit = true;
                            }
                            // 4. 正面左侧门框段墙 AABB 碰撞体
                            else if (dz >= 13.5 && dz <= 16.2 && dx >= -16.2 && dx <= -3.1) {
                                wallHit = true;
                            }
                            // 5. 正面右侧门框段墙 AABB 碰撞体
                            else if (dz >= 13.5 && dz <= 16.2 && dx >= 3.1 && dx <= 16.2) {
                                wallHit = true;
                            }
                            // 6. 木门门板区域 (大门关闭 !isOpen 时作为碰撞实体阻挡，开门时则虚空通行)
                            else if (!d.isOpen && dz >= 13.5 && dz <= 16.2 && dx >= -3.25 && dx <= 3.25) {
                                wallHit = true;
                            }

                            if (wallHit) {
                                pPos.x = oldX;
                                pPos.z = oldZ;
                                break;
                            }
                        }
                    }
                }

                // --- 阶段二：垂直 Y 轴物理位移 (重力坠落/起跳) 与踩立判定 ---
                pPos.y += velocity.y * delta;

                let hitColliderY = false;
                let landingY = 0;

                // 新增：玩家落在屋顶上的垂直落足踩立判定
                for (let i = 0; i < housePositions.length; i++) {
                    let hPos = housePositions[i];
                    let dx = Math.abs(pPos.x - hPos.x);
                    let dz = Math.abs(pPos.z - hPos.z);
                    if (dx <= 15.6 && dz <= 15.6) {
                        let roofSurfaceY = hPos.baseHeight + 38.1 - 14 * (Math.max(dx, dz) / 15.556);
                        // 判定是否是从上往下落到屋顶上：允许 2.0 的穿透容差判定
                        if (oldY - 4.5 >= roofSurfaceY - 2.0 && (pPos.y - 5.0) <= roofSurfaceY) {
                            hitColliderY = true;
                            landingY = roofSurfaceY + 5.0; // 踩立在表面 (眼睛中轴在 roofSurfaceY + 5)
                            break;
                        }
                    }
                }

                // 3. 玩家与树顶、石头顶部的垂直落足、踩立判定
                if (!hitColliderY) {
                    let pBoxY = new THREE.Box3().setFromCenterAndSize(pPos, new THREE.Vector3(3, 10, 3));
                    for(let box of colliders) {
                        if(pBoxY.intersectsBox(box)) {
                            // 判定是否是从上往下踩在石头顶表面：前一帧脚底高度 (oldY - 4.5) 必须在石头顶盖 (box.max.y) 以上或附近
                            if (oldY - 4.5 >= box.max.y - 1.2) {
                                hitColliderY = true;
                                landingY = box.max.y + 5.0; // 踩立在表面 (眼睛中轴在 box.max.y + 5)
                                break;
                            }
                        }
                    }
                }

                if (hitColliderY) {
                    pPos.y = landingY;
                    velocity.y = 0;
                    canJump = true; // 允许站在石头、树顶和屋顶表面正常活动和再次起跳！
                } else {
                    // 若未落在大石头顶盖上，则判定降落到草地形地面、或洋房实木地板上
                    let groundY = getTerrainHeight(pPos.x, pPos.z) + 10;
                    if (pPos.y <= groundY + 0.5 && velocity.y <= 0) {
                        velocity.y = 0;
                        pPos.y = groundY;
                        canJump = true;
                    } else if (pPos.y > groundY + 0.5) {
                        canJump = false;
                    }
                }

                // 拾取物资检测
                let nearbyLoot = null;
                let nearbyIndex = -1;
                for(let i=lootItems.length-1; i>=0; i--) {
                    // 使用距离的平方，极大地减少 CPU 计算量（避免 Math.sqrt）
                    if(pPos.distanceToSquared(lootItems[i].mesh.position) < 225) { // 15 * 15 = 225
                        nearbyLoot = lootItems[i];
                        nearbyIndex = i;
                        break;
                    }
                }

                // 门板交互检测 (16*16 = 256 是 4米内开门，极为灵敏和适中)
                let nearbyDoor = null;
                for(let i=0; i<doors.length; i++) {
                    let d = doors[i];
                    let doorWorldPos = d.housePos.clone().add(new THREE.Vector3(0, 4.75, 15)); // 门铰链世界坐标位置
                    if (pPos.distanceToSquared(doorWorldPos) < 256) {
                        nearbyDoor = d;
                        break;
                    }
                }

                const promptEl = document.getElementById('interact-prompt');
                if(nearbyLoot) {
                    let itemName = nearbyLoot.data ? nearbyLoot.data.name : (nearbyLoot.type === 'health' ? '急救包' : '物资');
                    promptEl.innerText = `按 F 拾取 ${itemName}`;
                    promptEl.style.display = 'block';

                    if(interactKey) {
                        interactKey = false; // 消费按键事件
                        let picked = false;
                        if (nearbyLoot.type === "ammo") {
                            const amount = nearbyLoot.data.amount;
                            player.sharedAmmo += amount;
                            showNotice(`拾取 ${amount} 发通用子弹`, "#27ae60");
                            picked = true;
                        } else if(nearbyLoot.type === "health") {
                            player.health = Math.min(player.maxHealth, player.health + 150);
                            showNotice("使用 急救包 (+150 HP)", "#e74c3c");
                            picked = true;
                        } else if(nearbyLoot.type === "weapon") {
                            // 优先放入槽位2（如果空），否则替换槽位1
                            let weaponData;
                            let targetSlot = null;

                            if (player.inventory[1] === null) {
                                // 槽位2空，优先放入槽位2
                                targetSlot = 1;
                            } else if (player.inventory[0] === null) {
                                // 槽位1空，放入槽位1
                                targetSlot = 0;
                            } else {
                                // 两把武器都已装备，替换当前武器
                                targetSlot = player.currentWeaponIndex;
                            }

                            // 如果不是替换当前武器，瞄准镜转移到新武器上
                            if (targetSlot !== player.currentWeaponIndex) {
                                let oldScope = player.weapon.scope;
                                weaponData = { ...nearbyLoot.data, ammo: nearbyLoot.data.maxAmmo, scope: oldScope };
                            } else {
                                // 替换当前槽位，瞄准镜在两把武器之间交换
                                let oldWeapon = player.weapon;
                                let newScope = oldWeapon.scope;
                                weaponData = { ...nearbyLoot.data, ammo: nearbyLoot.data.maxAmmo, scope: newScope };
                            }

                            player.sharedAmmo += 60;
                            player.inventory[targetSlot] = weaponData;
                            equipWeapon(targetSlot);
                            showNotice("拾取武器: " + nearbyLoot.data.name + " (按R换弹)", "#f1c40f");
                            picked = true;
                        } else if(nearbyLoot.type === "scope") {
                            // 瞄准镜安装到当前武器上，随时可以替换
                            player.weapon.scope = nearbyLoot.data;
                            showNotice(`安装 ${nearbyLoot.data.name} 到 ${player.weapon.name}`, "#" + nearbyLoot.data.color.toString(16));
                            picked = true;
                        } else if(nearbyLoot.type === "helmet") {
                            if(!player.helmet || player.helmet.level < nearbyLoot.data.level) {
                                player.helmet = nearbyLoot.data;
                                showNotice("装备: " + nearbyLoot.data.name, "#" + nearbyLoot.data.color.toString(16));
                                picked = true;
                            } else {
                                showNotice("已有更高级的头盔", "#ccc");
                            }
                        } else if(nearbyLoot.type === "armor") {
                            if(!player.armor || player.armor.level < nearbyLoot.data.level) {
                                player.armor = nearbyLoot.data;
                                showNotice("装备: " + nearbyLoot.data.name, "#" + nearbyLoot.data.color.toString(16));
                                picked = true;
                            } else {
                                showNotice("已有更高级的护甲", "#ccc");
                            }
                        }

                        if(picked) {
                            scene.remove(nearbyLoot.mesh);
                            lootItems.splice(nearbyIndex, 1);
                            updateUI();
                        }
                    }
                } else if(nearbyDoor) {
                    promptEl.innerText = `按 F ${nearbyDoor.isOpen ? '关门' : '开门'}`;
                    promptEl.style.display = 'block';

                    if (interactKey) {
                        interactKey = false; // 消费按键事件
                        nearbyDoor.isOpen = !nearbyDoor.isOpen;
                        nearbyDoor.targetAngle = nearbyDoor.isOpen ? Math.PI / 1.8 : 0; // 展开约100度
                        showNotice(nearbyDoor.isOpen ? "🚪 避难屋大门已被拉开" : "🚪 避难屋大门已被反锁紧闭", "#2ecc71");
                        // 播放开门/关门质感木头声音
                        playSound('hit', {x: nearbyDoor.housePos.x, y: nearbyDoor.housePos.y, z: nearbyDoor.housePos.z});
                    }
                } else {
                    promptEl.style.display = 'none';
                }
            }
        }

        function fireWeapon() {
            if(!player.alive || player.isParachuting || player.isReloading) return;
            let now = Date.now();
            if(now - player.lastFire < player.weapon.fireRate) return;

            if(player.weapon.ammo <= 0) {
                showNotice("弹匣为空！按 R 换弹", "#e74c3c");
                if(player.sharedAmmo > 0) {
                    setTimeout(() => { if(player.weapon.ammo <= 0 && !player.isReloading) reloadWeapon(); }, 500);
                }
                return;
            }
            player.weapon.ammo--;
            player.lastFire = now;
            updateUI();
            playSound(player.weapon.sound);

            // 后坐力：用欧拉角方式（和PointerLockControls一致），防止翻滚
            const RECOIL_AMOUNT = 0.012;
            player.cameraRecoil += RECOIL_AMOUNT;
            if(player.cameraRecoil > 0.08) player.cameraRecoil = 0.08;
            const _re = new THREE.Euler(0, 0, 0, 'YXZ');
            _re.setFromQuaternion(camera.quaternion);
            _re.x += RECOIL_AMOUNT;
            _re.x = Math.min(_re.x, 1.5);
            _re.z = 0;
            camera.quaternion.setFromEuler(_re);

            player.recoilY += 0.3;

            // 枪口火花效果
            spawnMuzzleFlash();

            // 武器后坐力动画（上扬 + 后退）
            if(viewWeaponMesh) {
                viewWeaponMesh.rotation.x -= 0.3;
                viewWeaponMesh.position.z += 0.15;
            }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(objects);

            // 找到第一个障碍物(建筑/树木/石头)以及第一个射击目标(Bot/丧尸)
            let coverHit = null;
            let targetHit = null;

            for(let i = 0; i < intersects.length; i++) {
                let hit = intersects[i];
                if(hit.distance > player.weapon.range) break;

                let ud = hit.object.userData;
                if(ud.isBot || ud.isZombie || ud.isAnimal) {
                    if(!targetHit) targetHit = hit;
                } else {
                    if(!coverHit) coverHit = hit;
                }
            }

            // 如果障碍物比目标更近，子弹被障碍物挡住
            if(coverHit && (!targetHit || coverHit.distance < targetHit.distance)) {
                let n = coverHit.face ? coverHit.face.normal : new THREE.Vector3(0,1,0);
                for(let i=0; i<3; i++) {
                    const dust = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), new THREE.MeshBasicMaterial({color: 0x7f8c8d}));
                    dust.position.copy(coverHit.point);
                    scene.add(dust);
                    bloodParticles.push({mesh: dust, vx: n.x*5+(Math.random()-0.5)*10, vy: n.y*5+Math.random()*10, vz: n.z*5+(Math.random()-0.5)*10, age: 0});
                }
            } else if(targetHit) {
                let ud = targetHit.object.userData;
                if (ud.isBot) {
                    let bot = bots[ud.botIndex];
                    if(bot.alive) {
                        let dmg = calcDamage(player.weapon.damage, ud.isHeadshot, bot);
                        bot.health -= dmg;
                        playSound('hit');

                        let n = targetHit.face ? targetHit.face.normal : new THREE.Vector3(0,1,0);
                        spawnBlood(targetHit.point, n);

                        document.getElementById('crosshair').style.background = 'red';
                        document.getElementById('crosshair').style.transform = 'translate(-50%, -50%) scale(1.5)';
                        setTimeout(()=>{
                            document.getElementById('crosshair').style.background = 'rgba(0,255,0,0.8)';
                            document.getElementById('crosshair').style.transform = 'translate(-50%, -50%) scale(1)';
                        }, 100);

                        if(bot.health <= 0) botDied(bot, "You");
                    }
                } else if (ud.isZombie) {
                    let zombie = zombies[ud.zombieIndex];
                    if (zombie && zombie.alive) {
                        let dmg = calcDamage(player.weapon.damage, ud.isHeadshot, zombie);
                        zombie.health -= dmg;
                        playSound('hit');

                        let n = targetHit.face ? targetHit.face.normal : new THREE.Vector3(0,1,0);
                        spawnBlood(targetHit.point, n);

                        document.getElementById('crosshair').style.background = 'red';
                        document.getElementById('crosshair').style.transform = 'translate(-50%, -50%) scale(1.5)';
                        setTimeout(()=>{
                            document.getElementById('crosshair').style.background = 'rgba(0,255,0,0.8)';
                            document.getElementById('crosshair').style.transform = 'translate(-50%, -50%) scale(1)';
                        }, 100);

                        if(zombie.health <= 0) zombieDied(zombie);
                    }
                } else if (ud.isAnimal) {
                    let animal = ud.animalType === 'deer' ? deers[ud.index] : boars[ud.index];
                    if (animal && animal.alive) {
                        // 动物不计爆头，承受普通武器伤害
                        animal.health -= player.weapon.damage;
                        playSound('hit');

                        let n = targetHit.face ? targetHit.face.normal : new THREE.Vector3(0,1,0);
                        spawnBlood(targetHit.point, n);

                        document.getElementById('crosshair').style.background = 'red';
                        document.getElementById('crosshair').style.transform = 'translate(-50%, -50%) scale(1.5)';
                        setTimeout(()=>{
                            document.getElementById('crosshair').style.background = 'rgba(0,255,0,0.8)';
                            document.getElementById('crosshair').style.transform = 'translate(-50%, -50%) scale(1)';
                        }, 100);

                        if (animal.health <= 0) {
                            killAnimal(animal, ud.animalType);
                        }
                    }
                }
            }
        }

        function updateBots(delta) {
            let now = Date.now();
            let playerPos = controls.getObject().position;
            let diff = difficulties[currentDifficulty];

            // 限制每帧最多只更新一部分机器人的 AI 逻辑，大幅度减少卡顿
            // 将机器人们分批处理，但运动状态每帧都更新
            let currentTick = now % 5;

            bots.forEach((bot, idx) => {
                if(!bot.alive) return;

                if(bot.isParachuting) {
                    bot.mesh.position.y -= (25 + Math.random()*10) * delta;
                    let bPos = bot.mesh.position;
                    bot.mesh.position.x += Math.cos(bot.id) * 15 * delta;
                    bot.mesh.position.z += Math.sin(bot.id) * 15 * delta;

                    let groundY = getTerrainHeight(bPos.x, bPos.z);
                    if(bPos.y <= groundY) {
                        bPos.y = groundY;
                        bot.isParachuting = false;
                        bot.parachuteMesh.visible = false;
                    }
                    return;
                }

                let bPos = bot.mesh.position;
                let oldBx = bPos.x, oldBz = bPos.z; // 记录移动前的旧位置

                // 仅仅是当前帧选中的机器人，且过了变向时间的，才进行复杂的距离运算
                if((idx % 5) === currentTick && now > bot.changeDirTime) {
                    bot.changeDirTime = now + 1500 + Math.random()*2500;
                    let closestTarget = null;
                    let minDistSq = diff.botTargetRange * diff.botTargetRange; // 优化：使用难度动态索敌范围

                    if(player.alive && !player.isParachuting) {
                        let dSq = bPos.distanceToSquared(playerPos);
                        if(dSq < minDistSq) { minDistSq = dSq; closestTarget = 'player'; }
                    }

                    bots.forEach(other => {
                        if(other.alive && !other.isParachuting && other.id !== bot.id) {
                            let dSq = bPos.distanceToSquared(other.mesh.position);
                            if(dSq < minDistSq) { minDistSq = dSq; closestTarget = other; }
                        }
                    });

                    bot.target = closestTarget;

                    if(!bot.target) {
                        bot.state = 'wander';
                        let distToZoneCenterSq = Math.pow(bPos.x - zone.x, 2) + Math.pow(bPos.z - zone.z, 2);
                        if(distToZoneCenterSq > zone.radius * zone.radius * 0.81) {
                            let angle = Math.atan2(zone.z - bPos.z, zone.x - bPos.x);
                            bot.vx = Math.cos(angle) * 20;
                            bot.vz = Math.sin(angle) * 20;
                        } else {
                            let angle = Math.random() * Math.PI * 2;
                            bot.vx = Math.cos(angle) * 15;
                            bot.vz = Math.sin(angle) * 15;
                        }
                    } else {
                        bot.state = 'attack';
                    }
                }

                if(bot.state === 'wander') {
                    bPos.x += bot.vx * delta;
                    bPos.z += bot.vz * delta;
                    bPos.y = getTerrainHeight(bPos.x, bPos.z);
                    if(bot.laserMesh) bot.laserMesh.visible = false;
                } else if(bot.state === 'attack' && bot.target) {
                    let targetPos = bot.target === 'player' ? playerPos : bot.target.mesh.position;
                    bot.mesh.lookAt(targetPos.x, bPos.y, targetPos.z);
                    if(bot.laserMesh) bot.laserMesh.visible = true;

                    // 攻击状态下的灵活战术移动 (身法)
                    let speed = diff.botSpeed || 20;
                    let dir = new THREE.Vector3().subVectors(targetPos, bPos);
                    dir.y = 0;
                    let dist = dir.length();
                    dir.normalize();

                    if(dist > 80) {
                        // 距离较远，全力朝目标奔跑缩短距离
                        bPos.x += dir.x * speed * delta;
                        bPos.z += dir.z * speed * delta;
                    } else if(dist < 30) {
                        // 距离太近，朝目标反方向倒车拉开距离
                        bPos.x -= dir.x * speed * delta;
                        bPos.z -= dir.z * speed * delta;
                    } else {
                        // 处于极佳射击距离，左右侧移 (Strafe) 躲避子弹
                        let strafeDir = (Math.floor(now / 2000) + bot.id) % 2 === 0 ? 1 : -1;
                        let perp = new THREE.Vector3(-dir.z, 0, dir.x);
                        bPos.x += perp.x * speed * 0.85 * strafeDir * delta;
                        bPos.z += perp.z * speed * 0.85 * strafeDir * delta;
                    }
                    bPos.y = getTerrainHeight(bPos.x, bPos.z);

                    if(now - bot.lastFire > bot.weapon.fireRate * diff.botFireRateMultiplier) {
                        bot.lastFire = now;
                        // 这里传入带有真实坐标的对象给播放器，如果声音太大可能要考虑限制播放数量
                        playSound(bot.weapon.sound, {x: bPos.x, y: bPos.y, z: bPos.z});

                        if(bot.laserMesh) {
                            bot.laserMesh.material.opacity = 1.0;
                            setTimeout(()=> { if(bot.laserMesh) bot.laserMesh.material.opacity = 0.6; }, 100);
                        }

                        // 根据难度调整命中率
                        if(Math.random() < bot.accuracy) {
                            let isHeadshot = Math.random() > 0.9;
                            if(bot.target === 'player') {
                                // --- Bot 视线检测 (Line of Sight) ---
                                const botHeadPos = bot.mesh.position.clone().add(new THREE.Vector3(0, 5, 0)); // 从 bot 头部位置发射射线
                                const playerPos = controls.getObject().position;
                                const direction = new THREE.Vector3().subVectors(playerPos, botHeadPos).normalize();
                                const ray = new THREE.Raycaster(botHeadPos, direction, 0, 1000);
                                const intersects = ray.intersectObjects(objects);

                                let isBlocked = false;

                                // 绝对视线掩体防护：如果玩家身处洋房内部，且该洋房的大门关闭（!isOpen）时，外部射击100%直接格挡！
                                let insideHouse = getHousePlayerIsInside();
                                if (insideHouse && !insideHouse.isOpen) {
                                    isBlocked = true; // 大门紧闭，100% 免疫屋外子弹
                                } else if (intersects.length > 0) {
                                    // 如果射线第一个命中的物体比到玩家的距离还近，说明视线被阻挡
                                    if (intersects[0].distance < botHeadPos.distanceTo(playerPos)) {
                                        // 确保射线不是击中了开火者自己
                                        if (intersects[0].object.userData.botIndex !== bot.id) {
                                            isBlocked = true;
                                        }
                                    }
                                }

                                if (!isBlocked) {
                                    let dmg = calcDamage(bot.weapon.damage * diff.botToPlayerDamageFactor, isHeadshot, player);
                                    playerHit(dmg);
                                }
                            } else {
                                let dmg = calcDamage(bot.weapon.damage * 0.5, isHeadshot, bot.target);
                                bot.target.health -= dmg;

                                let n = new THREE.Vector3(0, 1, 0);
                                spawnBlood(bot.target.mesh.position.clone().add(new THREE.Vector3(0, 4, 0)), n);

                                if(bot.target.health <= 0) {
                                    botDied(bot.target, "Bot " + bot.id);
                                    bot.target = null;
                                    bot.changeDirTime = 0;
                                }
                            }
                        }
                    }
                }

                // 机器人与所有洋房墙体、门板的 AABB 盒子物理碰撞阻挡 (防止机器人穿模)
                for (let i = 0; i < doors.length; i++) {
                    let d = doors[i];
                    let hPos = d.housePos;
                    let dx = bPos.x - hPos.x;
                    let dz = bPos.z - hPos.z;
                    let dy = bPos.y - hPos.y;

                    if (dy > 0 && dy < 24) {
                        let absX = Math.abs(dx);
                        let absZ = Math.abs(dz);

                        if (absX < 16.2 && absZ < 16.2) {
                            let wallHit = false;

                            if ((dx >= -16.2 && dx <= -13.5 && dz >= -16.2 && dz <= 16.2) || // 左侧墙壁
                                (dx >= 13.5 && dx <= 16.2 && dz >= -16.2 && dz <= 16.2) ||  // 右侧墙壁
                                (dz >= -16.2 && dz <= -13.5 && dx >= -16.2 && dx <= 16.2) || // 后侧墙壁
                                (dz >= 13.5 && dz <= 16.2 && dx >= -16.2 && dx <= -3.1) ||  // 正面左门框
                                (dz >= 13.5 && dz <= 16.2 && dx >= 3.1 && dx <= 16.2) ||   // 正面右门框
                                (!d.isOpen && dz >= 13.5 && dz <= 16.2 && dx >= -3.25 && dx <= 3.25)) { // 门关着阻拦
                                wallHit = true;
                            }

                            if (wallHit) {
                                bPos.x = oldBx;
                                bPos.z = oldBz;
                                break;
                            }
                        }
                    }
                }
            });
        }

        function playerHit(dmg) {
            if(player.isParachuting) return;
            player.health -= dmg;
            playSound('hit');
            document.getElementById('hit-overlay').style.opacity = '1';
            setTimeout(() => { document.getElementById('hit-overlay').style.opacity = '0'; }, 150);

            updateUI();
            if(player.health <= 0) {
                player.alive = false;
                controls.unlock();
                document.getElementById('title').innerText = "游戏结束 (YOU DIED)";
                document.getElementById('title').style.color = "#e74c3c";
                document.getElementById('subtitle').innerText = "排名: #" + aliveCount;
                document.getElementById('start-btn').innerText = "重新开始";
                document.getElementById('start-btn').style.display = "block";
                document.getElementById('start-btn').onclick = () => location.reload();
                document.getElementById('overlay').style.display = "flex";
            }
        }

        function botDied(bot, killerName) {
            if(!bot.alive) return; // 防止重复计算
            bot.alive = false;
            scene.remove(bot.mesh);
            aliveCount = Math.max(1, aliveCount - 1); // 不会低于1（玩家）

            let idx1 = objects.indexOf(bot.bodyMesh);
            if(idx1 > -1) objects.splice(idx1, 1);
            let idx2 = objects.indexOf(bot.headMesh);
            if(idx2 > -1) objects.splice(idx2, 1);
            let idx3 = objects.indexOf(bot.packMesh);
            if(idx3 > -1) objects.splice(idx3, 1);

            if(killerName === "You") {
                player.kills++;
                showNotice("击杀 Bot " + bot.id, "#f1c40f");
            }

            addKillFeed(`[${killerName}] 击杀了 [Bot ${bot.id}]`);
            updateUI();

            if(aliveCount === 1 && player.alive) {
                // 当存活总数变为 1 且玩家活着，直接宣告玩家胜利吃鸡！(修复由于最后一人死于毒圈/内斗导致无法吃鸡的严重 Bug)
                setTimeout(() => {
                    controls.unlock();
                    document.getElementById('title').innerText = "大吉大利，今晚吃鸡！";
                    document.getElementById('title').style.color = "#f1c40f";
                    document.getElementById('subtitle').innerText = `WINNER WINNER CHICKEN DINNER! 击杀数: ${player.kills}`;
                    document.getElementById('start-btn').innerText = "再玩一局";
                    document.getElementById('start-btn').style.display = "block";
                    document.getElementById('start-btn').onclick = () => location.reload();
                    document.getElementById('overlay').style.display = "flex";
                }, 800);
            }
        }

        function addKillFeed(msg) {
            killFeed.push(msg);
            if(killFeed.length > 4) killFeed.shift();
            document.getElementById('kill-feed').innerHTML = killFeed.join('<br>');
            setTimeout(() => {
                killFeed.shift();
                document.getElementById('kill-feed').innerHTML = killFeed.join('<br>');
            }, 6000);
        }

        function updateZone(delta) {
            let now = Date.now();
            if(now - zone.lastTick > 1000) {
                zone.lastTick = now;
                zone.nextShrinkTime--;

                if(zone.nextShrinkTime <= 0) {
                    zone.phase++;
                    zone.targetRadius = zone.radius * 0.6;
                    let angle = Math.random() * Math.PI * 2;
                    let dist = Math.random() * (zone.radius - zone.targetRadius);
                    zone.targetX = zone.x + Math.cos(angle) * dist;
                    zone.targetZ = zone.z + Math.sin(angle) * dist;
                    zone.nextShrinkTime = 60;
                    addKillFeed("<span style='color:#3498db'>安全区开始缩小！</span>");
                }

                if(player.alive && !player.isParachuting) {
                    let pPos = controls.getObject().position;
                    let dist = Math.sqrt(Math.pow(pPos.x - zone.x, 2) + Math.pow(pPos.z - zone.z, 2));
                    if(dist > zone.radius) {
                        playerHit(zone.phase * 2);
                        document.getElementById('zone-overlay').style.opacity = '1';
                    } else {
                        document.getElementById('zone-overlay').style.opacity = '0';
                    }
                }

                bots.forEach(bot => {
                    if(bot.alive && !bot.isParachuting) {
                        let dist = Math.sqrt(Math.pow(bot.mesh.position.x - zone.x, 2) + Math.pow(bot.mesh.position.z - zone.z, 2));
                        if(dist > zone.radius) {
                            bot.health -= zone.phase * 2;
                            if(bot.health <= 0) botDied(bot, "毒圈 (Playzone)");
                        }
                    }
                });
            }

            if(zone.radius > zone.targetRadius) {
                zone.radius -= 15 * delta;
                zone.x += (zone.targetX - zone.x) * 0.05 * delta;
                zone.z += (zone.targetZ - zone.z) * 0.05 * delta;
                zoneMesh.scale.set(zone.radius, 1, zone.radius);
                zoneMesh.position.set(zone.x, 500, zone.z);
            }
        }

        function showNotice(msg, color="#fff") {

            el.style.left = '50%';

        function preGenerateHouses() {
            housePositions = [];
            for(let i=0; i<200; i++) {
                let x = (Math.random() - 0.5) * mapSize * 0.8;
                let z = (Math.random() - 0.5) * mapSize * 0.8;
                let baseHeight = getBaseTerrainHeight(x, z);
                if(baseHeight < 2) {
                    continue; // 水中不生成，重新选点
                }

                // 建筑防重合检测：确保每座房子之间保持至少 80 米的安全间距，彻底防止重叠穿模
                let tooClose = false;
                for (let j = 0; j < housePositions.length; j++) {
                    let h = housePositions[j];
                    let dx = x - h.x;
                    let dz = z - h.z;
                    if (dx*dx + dz*dz < 80 * 80) {
                        tooClose = true;
                        break;
                    }
                }
                if (tooClose) {
                    continue;
                }

                housePositions.push({ x, z, baseHeight });
            }
        }

        let prevTime = performance.now();

            ambLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambLight);
            dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(1000, 2000, 1000);
            scene.add(dirLight);

            // 初始化白云
            initClouds();

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" }); // 关闭抗锯齿，大幅提升帧率
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // 限制像素比例

            controls.addEventListener('unlock', () => {
                if(player.alive && aliveCount > 1) {
                    document.getElementById('overlay').style.display = 'flex';
                    document.getElementById('title').innerText = "暂停 (PAUSED)";
                    document.getElementById('subtitle').innerText = "点击按钮继续";

            });

            scene.add(controls.getObject());

            // 建立第一人称武器模型容器
            viewWeaponMesh = new THREE.Group();

            // 玩家降落伞

            const canopyMat = new THREE.MeshLambertMaterial({color: 0x2e86c1, side: THREE.DoubleSide});
            const canopy = new THREE.Mesh(canopyGeo, canopyMat);
            canopy.position.y = 12;
            canopy.scale.y = 0.4;
            parachuteGroup.add(canopy);
            const stringMat = new THREE.LineBasicMaterial({ color: 0xffffff });
            for(let i=0; i<8; i++) {

                    new THREE.Vector3(0, 0, 0)
                ];

                const stringLine = new THREE.Line(stringGeo, stringMat);
                parachuteGroup.add(stringLine);
            }
            controls.getObject().add(parachuteGroup);

            raycaster = new THREE.Raycaster();

            preGenerateHouses(); // 预生成所有房屋位置以让地形在渲染前平整铺平
            initTerrain();
            initEnvironment();
            initAnimals();

            const zoneGeo = new THREE.CylinderGeometry(1, 1, 2000, 48, 1, true);
            const zoneMat = new THREE.MeshBasicMaterial({color: 0x0000ff, transparent: true, opacity: 0.15, side: THREE.DoubleSide});
            zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
